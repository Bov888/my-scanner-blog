<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,300;0,400;0,500;1,300&family=JetBrains+Mono:wght@400;500&display=swap&font-display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
:root {
  --bg: #fafaf8; --surface: #f4f3ef; --text: #1a1917; --muted: #6b6963;
  --accent: #2d5a27; --accent-light: #e8f0e6; --border: #e2e1db; --max: 680px;
  --menu-height: 0px;
}
[data-theme="dark"] {
  --bg: #141412; --surface: #1e1d1b; --text: #e8e6e0; --muted: #8a8880;
  --accent: #6ab05f; --accent-light: #1e2e1c; --border: #2e2d2a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 18px; }
body { background: var(--bg); color: var(--text); font-family: 'Literata', Georgia, serif; font-weight: 300; line-height: 1.75; min-height: 100vh; }

/* ХЕДЕР */
header { border-bottom: 1px solid var(--border); padding: 0.9rem 1.5rem; position: sticky; top: 0; background: var(--bg); z-index: 100; transition: border-bottom-color 0.15s; }
header.menu-open { border-bottom-color: transparent; }
.header-inner { max-width: var(--max); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.site-title { font-weight: 500; font-size: 1rem; color: var(--text); cursor: pointer; letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.4rem; white-space: nowrap; flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; line-height: 1; background: none; border: none; font-family: inherit; }
.site-title span { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }

.theme-toggle { background: var(--accent-light); border: 1px solid var(--accent); color: var(--accent); font-size: 0.6rem; font-family: 'JetBrains Mono', monospace; cursor: pointer; padding: 0.35rem 0.65rem; border-radius: 2px; transition: opacity 0.2s; letter-spacing: 0.06em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 0.3rem; white-space: nowrap; flex-shrink: 0; line-height: 1; }
.theme-toggle:hover { opacity: 0.7; }

.burger-btn { background: none; border: none; cursor: pointer; padding: 4px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; flex-shrink: 0; }
.burger-btn span { display: block; width: 20px; height: 1.5px; background: var(--muted); border-radius: 1px; transition: all 0.25s; }
.burger-btn.open span:nth-child(1) { transform: rotate(45deg) translate(4.5px, 4.5px); }
.burger-btn.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.burger-btn.open span:nth-child(3) { transform: rotate(-45deg) translate(4.5px, -4.5px); }

/* Бургер меню */
.burger-menu { display: none; background: var(--bg); border-bottom: 1px solid var(--border); padding: 0.75rem; }
.burger-menu.open { display: block; }
.burger-menu-inner { display: grid; grid-template-columns: 1fr; gap: 0.5rem; max-width: 320px; margin: 0 auto; }
.burger-menu a { background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 0.8rem; cursor: pointer; transition: all 0.2s; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); display: block; text-decoration: none; }
.burger-menu a:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

/* Main */
main { max-width: var(--max); margin: 0 auto; padding: calc(3rem + var(--menu-height)) 1.5rem 6rem; transition: padding-top 0.2s ease; }

.page { display: none; }
.page.active { display: block; }

/* МОБІЛЬНИЙ */
@media (max-width: 600px) {
  html { font-size: 16px; }
  .hero h1 { font-size: 1.8rem; }
  .post-item { grid-template-columns: 1fr; gap: 0.3rem; }
  .post-date { padding-top: 0; }
  header { padding: 0.75rem 1rem; }
}

/* ПОШУК */
.search-bar { position: relative; margin-bottom: 1.5rem; }
.search-input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; padding: 0.7rem 1rem 0.7rem 2.4rem; border-radius: 2px; outline: none; transition: border-color 0.2s; }
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--muted); }
.search-icon { position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.8rem; pointer-events: none; }
.search-clear { position: absolute; right: 0.8rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; display: none; }
.search-clear.visible { display: block; }

/* ГЕРОЙ */
.hero { padding: 3rem 0 4rem; border-bottom: 1px solid var(--border); margin-bottom: 3.5rem; }
.hero-label { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1.2rem; }
.hero h1 { font-size: 1.5rem; font-weight: 300; line-height: 1.3; letter-spacing: -0.02em; margin-bottom: 1.2rem; max-width: 520px; }
.hero h1 em { font-style: italic; color: var(--accent); }
.hero p { color: var(--muted); font-size: 0.95rem; max-width: 460px; }

/* СПИСОК */
.posts-label { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 1.2rem; }
.tag-filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 2rem; }
.tag-filter { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid var(--border); color: var(--muted); padding: 0.3rem 0.7rem; border-radius: 2px; cursor: pointer; background: none; transition: all 0.2s; }
.tag-filter:hover { border-color: var(--accent); color: var(--accent); }
.tag-filter.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }

.post-item { display: grid; grid-template-columns: 80px 1fr; gap: 1.2rem; padding: 1.5rem 0; border-bottom: 1px solid var(--border); cursor: pointer; transition: opacity 0.2s; }
.post-item:first-of-type { border-top: 1px solid var(--border); }
.post-item:hover { opacity: 0.7; }
.post-date { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); padding-top: 0.3rem; line-height: 1.4; }
.post-title { font-size: 1.05rem; font-weight: 400; line-height: 1.4; margin-bottom: 0.4rem; }
.post-excerpt { font-size: 0.85rem; color: var(--muted); line-height: 1.6; }
.post-tag { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase; background: var(--accent-light); color: var(--accent); padding: 0.15rem 0.5rem; border-radius: 2px; margin-top: 0.5rem; cursor: pointer; transition: opacity 0.2s; border: none; }
.post-tag:hover { opacity: 0.7; }

/* ДОПИС */
.back-btn { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 2.5rem; display: flex; align-items: center; gap: 0.4rem; transition: color 0.2s; }
.back-btn:hover { color: var(--accent); }
.post-header { padding: 0 0 2rem; border-bottom: 1px solid var(--border); margin-bottom: 2.5rem; }
.post-header h2 { font-size: 1.4rem; font-weight: 300; line-height: 1.3; letter-spacing: -0.02em; margin-bottom: 1rem; }
.post-meta { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); letter-spacing: 0.05em; display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
.post-meta-tag { background: var(--accent-light); color: var(--accent); padding: 0.15rem 0.5rem; border-radius: 2px; cursor: pointer; transition: opacity 0.2s; border: none; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; letter-spacing: 0.05em; }
.post-meta-tag:hover { opacity: 0.7; }

/* ВМІСТ */
.post-content { font-size: 1rem; line-height: 1.8; }
.post-content h1,.post-content h2,.post-content h3 { font-weight: 400; line-height: 1.3; margin: 2rem 0 0.8rem; letter-spacing: -0.01em; }
.post-content p { margin-bottom: 1.2rem; }
.post-content blockquote { border-left: 3px solid var(--accent); padding-left: 1.2rem; color: var(--muted); font-style: italic; margin: 1.5rem 0; }
.post-content code { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; background: var(--surface); padding: 0.15rem 0.4rem; border-radius: 2px; }
.post-content pre { background: var(--surface); padding: 1.2rem; border-radius: 4px; overflow-x: auto; margin-bottom: 1.2rem; }
.post-content img { max-width: 100%; height: auto; border-radius: 4px; margin: 1rem 0; }
.post-content a { color: var(--accent); text-decoration: underline; text-decoration-color: var(--accent-light); text-underline-offset: 3px; transition: text-decoration-color 0.2s; }

/* YOUTUBE / ВІДЕО */
.youtube-wrap { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 4px; margin: 1.5rem 0; }
.youtube-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

/* КНОПКА ВГОРУ */
.scroll-top { position: fixed; bottom: 2rem; right: 1.5rem; background: var(--accent); color: var(--bg); border: none; cursor: pointer; width: 36px; height: 36px; border-radius: 2px; font-size: 1rem; display: none; align-items: center; justify-content: center; transition: opacity 0.2s; z-index: 50; }
.scroll-top.visible { display: flex; }

footer { border-top: 1px solid var(--border); padding: 2rem 1.5rem; }
footer p { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; text-align: center; }
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <button class="site-title" id="site-title" aria-label="На головну">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="15" r="4" fill="var(--accent)"/>
        <circle cx="16" cy="15" r="2.2" fill="var(--bg)"/>
      </svg>
      Як стати <span>успішним сканером</span>
    </button>
    <div class="header-right">
      <button class="theme-toggle" id="theme-toggle">☾ тема</button>
      <button class="burger-btn" id="burger-btn"><span></span><span></span><span></span></button>
    </div>
  </div>
  <nav id="burger-menu" class="burger-menu">
    <div class="burger-menu-inner">
      <a href="#" data-page="home">Дописи</a>
      <a href="#about" data-page="about">Про мене</a>
    </div>
  </nav>
</header>

<main id="main">
  <div id="page-home" class="page active">
    <div class="hero">
      <div class="hero-label">Блог</div>
      <h1>Нотатки людини з <em>широкими інтересами</em></h1>
      <p>Про PKM, ШІ, автоматизацію та життя. Без графіку.</p>
    </div>
    <div id="tag-filters" class="tag-filters"></div>
    <div class="search-bar">
      <input class="search-input" id="search-input" type="search" placeholder="Пошук...">
    </div>
    <div id="posts-container"><p class="loading">Завантаження...</p></div>
  </div>

  <div id="page-post" class="page">
    <button class="back-btn" id="back-btn-post">← до списку</button>
    <div class="post-header">
      <h2 id="post-title-display"></h2>
      <div class="post-meta">
        <span id="post-date-display"></span>
        <button id="post-tag-display" class="post-meta-tag"></button>
      </div>
    </div>
    <article id="post-content-display" class="post-content"></article>
    <div class="post-actions"><button class="share-btn" id="share-btn">↗ поділитись</button></div>
  </div>

  <div id="page-about" class="page">
    <div class="about-section">
      <h2>Про мене</h2>
      <p>Людина-сканер з Прикарпаття. Захоплююсь PKM, ШІ та бігом.</p>
    </div>
  </div>
</main>

<button class="scroll-top" id="scroll-top">↑</button>

<script>
const GITHUB_USER = 'Bov888';
const GITHUB_REPO = 'my-scanner-blog';
const POSTS_FOLDER = 'posts';
const MONTHS = ["СІЧ","ЛЮТ","БЕР","КВІ","ТРА","ЧЕР","ЛИП","СЕР","ВЕР","ЖОВ","ЛИС","ГРУ"];
const MONTHS_UA = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];

let allPosts = [];
let postsCache = {};

const $ = id => document.getElementById(id);
const els = {
  postsContainer: $('posts-container'),
  postContent: $('post-content-display'),
  postTitle: $('post-title-display'),
  postDate: $('post-date-display'),
  postTag: $('post-tag-display')
};

// Marked init
marked.setOptions({ breaks: true, gfm: true });

async function init() {
  window.addEventListener('hashchange', route);
  $('theme-toggle').onclick = toggleTheme;
  $('burger-btn').onclick = toggleBurger;
  $('site-title').onclick = () => { window.location.hash = ''; };
  $('back-btn-post').onclick = () => { window.location.hash = ''; };
  $('search-input').oninput = e => handleSearch(e.target.value);
  
  initTheme();
  route();
}

function initTheme() {
  if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
}

function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
}

function toggleBurger() {
  $('burger-menu').classList.toggle('open');
}

function route() {
  const hash = window.location.hash.replace('#', '');
  $('burger-menu').classList.remove('open');
  
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  
  if (!hash || hash === 'home') {
    $('page-home').classList.add('active');
    loadPosts();
  } else if (hash === 'about') {
    $('page-about').classList.add('active');
  } else {
    $('page-post').classList.add('active');
    openPost(hash);
  }
  window.scrollTo(0,0);
}

async function loadPosts() {
  try {
    const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${POSTS_FOLDER}`);
    const files = await res.json();
    const mdFiles = files.filter(f => f.name.endsWith('.md')).reverse();
    
    allPosts = await Promise.all(mdFiles.map(async f => {
      const r = await fetch(f.download_url);
      const text = await r.text();
      const slug = f.name.replace('.md', '');
      postsCache[slug] = text;
      return {
        slug,
        title: parseMeta(text, 'title') || slug,
        excerpt: parseMeta(text, 'excerpt') || '',
        tag: parseMeta(text, 'tag') || 'Блог',
        dateStr: parseMeta(text, 'date') || ''
      };
    }));
    renderList(allPosts);
  } catch (e) { console.error(e); }
}

function renderList(posts) {
  els.postsContainer.innerHTML = posts.map(p => {
    const d = new Date(p.dateStr);
    const dateHtml = isNaN(d) ? '' : `${MONTHS[d.getMonth()]}<br>${d.getFullYear()}`;
    return `
      <div class="post-item" onclick="location.hash='${p.slug}'">
        <div class="post-date">${dateHtml}</div>
        <div>
          <div class="post-title">${p.title}</div>
          <div class="post-excerpt">${p.excerpt}</div>
          <div class="post-tag">${p.tag}</div>
        </div>
      </div>`;
  }).join('');
}

function handleSearch(q) {
  const filtered = allPosts.filter(p => p.title.toLowerCase().includes(q.toLowerCase()));
  renderList(filtered);
}

async function openPost(slug) {
  let text = postsCache[slug];
  if (!text) {
    const res = await fetch(`https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${POSTS_FOLDER}/${slug}.md`);
    text = await res.text();
  }
  
  const title = parseMeta(text, 'title');
  const body = text.replace(/^---[\s\S]*?---\n?/, '');
  
  els.postTitle.textContent = title;
  els.postContent.innerHTML = marked.parse(decodeHtmlEntities(body));
  
  // Обробка медіа
  els.postContent.querySelectorAll('a').forEach(link => {
    const href = link.getAttribute('href') || '';
    
    // Cloudinary Фікс
    if (href.includes('cloudinary.com')) {
      const urlParams = new URLSearchParams(href.split('?')[1]);
      const cn = urlParams.get('cloud_name');
      const pi = urlParams.get('public_id');

      if (cn && pi) {
        // Якщо в назві є "запис", "audio" або розширення звуку — робимо аудіо
        const isAudio = /audio|sound|music|voice|запис/i.test(pi) || /\.(mp3|wav|ogg|m4a)$/i.test(pi);
        
        if (isAudio) {
          const audioSrc = `https://res.cloudinary.com/${cn}/video/upload/${pi}${pi.includes('.') ? '' : '.mp3'}`;
          const wrap = document.createElement('div');
          wrap.style.margin = '1.5rem 0';
          wrap.innerHTML = `<audio controls style="width:100%"><source src="${audioSrc}"></audio>`;
          link.parentNode.replaceChild(wrap, link);
        } else {
          const wrap = document.createElement('div');
          wrap.className = 'youtube-wrap';
          wrap.innerHTML = `<iframe src="https://player.cloudinary.com/embed/?cloud_name=${cn}&public_id=${encodeURIComponent(pi)}&fluid=true&controls=true" allowfullscreen></iframe>`;
          link.parentNode.replaceChild(wrap, link);
        }
      }
    }
  });
}

function parseMeta(text, key) {
  const m = text.match(new RegExp(`${key}:\\s*"?([^"\\n]+)"?`));
  return m ? m[1].trim() : null;
}

function decodeHtmlEntities(str) {
  const txt = document.createElement("textarea");
  txt.innerHTML = str;
  return txt.value;
}

window.onload = init;
</script>
</body>
</html>
