<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Як стати успішним сканером</title>

<meta name="description" content="Блог про PKM, продуктивність, ШІ та життя людини з широкими інтересами">
<meta name="author" content="Успішний сканер">
<link rel="canonical" href="https://uspishnyskaner.pp.ua/">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Як стати успішним сканером">
<meta property="og:title" content="Як стати успішним сканером">
<meta property="og:description" content="Блог про PKM, продуктивність, ШІ та життя людини з широкими інтересами">
<meta property="og:url" content="https://uspishnyskaner.pp.ua/">
<meta name="twitter:card" content="summary">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'><rect width='32' height='32' rx='6' fill='%231e2e1c'/><circle cx='16' cy='15' r='4' fill='%236ab05f'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,300;0,400;0,500;1,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>

<style>
:root {
  --bg: #fafaf8; --surface: #f4f3ef; --text: #1a1917; --muted: #6b6963;
  --accent: #2d5a27; --accent-light: #e8f0e6; --border: #e2e1db; --max: 680px;
}
[data-theme="dark"] {
  --bg: #141412; --surface: #1e1d1b; --text: #e8e6e0; --muted: #8a8880;
  --accent: #6ab05f; --accent-light: #1e2e1c; --border: #2e2d2a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 18px; }
body { background: var(--bg); color: var(--text); font-family: 'Literata', Georgia, serif; font-weight: 300; line-height: 1.75; min-height: 100vh; }

/* ХЕДЕР */
header { border-bottom: 1px solid var(--border); padding: 0.9rem 1.5rem; position: sticky; top: 0; background: var(--bg); z-index: 100; }
.header-inner { max-width: var(--max); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.site-title { font-weight: 500; font-size: 1rem; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 0.4rem; background: none; border: none; font-family: inherit; }
.site-title span { color: var(--accent); }

/* КНОПКИ */
.theme-toggle { background: var(--accent-light); border: 1px solid var(--accent); color: var(--accent); font-size: 0.6rem; font-family: 'JetBrains Mono', monospace; cursor: pointer; padding: 0.35rem 0.65rem; border-radius: 2px; text-transform: uppercase; }
.burger-btn { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
.burger-btn span { width: 20px; height: 1.5px; background: var(--muted); transition: 0.25s; }
.burger-btn.open span:nth-child(1) { transform: rotate(45deg) translate(4.5px, 4.5px); }
.burger-btn.open span:nth-child(2) { opacity: 0; }
.burger-btn.open span:nth-child(3) { transform: rotate(-45deg) translate(4.5px, -4.5px); }

/* МЕНЮ */
.burger-menu { display: none; background: var(--bg); border-bottom: 1px solid var(--border); padding: 0.75rem; }
.burger-menu.open { display: block; }
.burger-menu-inner { display: grid; grid-template-columns: 1fr; gap: 0.5rem; max-width: 320px; margin: 0 auto; }
.burger-menu a { background: var(--surface); border: 1px solid var(--border); padding: 0.8rem; text-align: center; text-decoration: none; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); text-transform: uppercase; }

/* ПОШУК */
.search-bar { position: relative; margin-bottom: 1.5rem; }
.search-input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: 'JetBrains Mono', monospace; padding: 0.7rem 1rem 0.7rem 2.4rem; border-radius: 2px; outline: none; }
.search-icon { position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

/* КОНТЕНТ */
main { max-width: var(--max); margin: 0 auto; padding: 3rem 1.5rem 6rem; }
.page { display: none; }
.page.active { display: block; }

.hero { padding: 3rem 0 4rem; border-bottom: 1px solid var(--border); margin-bottom: 3.5rem; }
.hero h1 { font-size: 1.5rem; font-weight: 300; margin-bottom: 1.2rem; }
.hero h1 em { color: var(--accent); font-style: italic; }

/* СПИСОК ПОСТІВ (ВІДНОВЛЕНО) */
.post-item { display: grid; grid-template-columns: 80px 1fr; gap: 1.2rem; padding: 1.5rem 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.post-date { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); padding-top: 0.3rem; }
.post-title { font-size: 1.05rem; font-weight: 400; margin-bottom: 0.4rem; }
.post-excerpt { font-size: 0.85rem; color: var(--muted); }
.post-tag { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; background: var(--accent-light); color: var(--accent); padding: 0.15rem 0.5rem; border-radius: 2px; margin-top: 0.5rem; border: none; }

.post-content img { max-width: 100%; height: auto; border-radius: 4px; margin: 1rem 0; }
.youtube-wrap { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 4px; margin: 1.5rem 0; }
.youtube-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

@media (max-width: 600px) {
  html { font-size: 16px; }
  .post-item { grid-template-columns: 1fr; gap: 0.3rem; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <button class="site-title" id="site-title">Як стати <span>успішним сканером</span></button>
    <div class="header-right">
      <button class="theme-toggle" id="theme-toggle">☾ ТЕМА</button>
      <button class="burger-btn" id="burger-btn" aria-label="Меню">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
  <nav id="burger-menu" class="burger-menu">
    <div class="burger-menu-inner" id="burger-inner">
      <a href="#" data-page="home">Дописи</a>
      <a href="#about" data-page="about">Про мене</a>
    </div>
  </nav>
</header>

<main>
  <div id="page-home" class="page active">
    <div class="hero">
      <h1>Нотатки людини з <em>широкими інтересами</em></h1>
      <p>Про PKM, ШІ та автоматизацію. Без графіку.</p>
    </div>
    <div class="search-bar">
      <span class="search-icon">⌕</span>
      <input class="search-input" id="search-input" type="search" placeholder="Пошук...">
    </div>
    <div id="posts-container">Завантаження...</div>
  </div>

  <div id="page-post" class="page">
    <button class="post-tag" onclick="location.hash=''">← НАЗАД</button>
    <article id="post-content-display" class="post-content" style="margin-top:2rem"></article>
  </div>
  
  <div id="page-about" class="page">
    <h2>Про мене</h2>
    <p>Людина-сканер. 7+ років у телекомі. Захоплююсь PKM та автоматизацією.</p>
  </div>
</main>

<script>
const GITHUB_CONFIG = { user: 'Bov888', repo: 'my-scanner-blog' };
let allPosts = [];

// --- Logic ---
async function init() {
  setupUI();
  await loadPosts();
  route();
}

function setupUI() {
  $('theme-toggle').onclick = toggleTheme;
  $('burger-btn').onclick = () => {
    $('burger-btn').classList.toggle('open');
    $('burger-menu').classList.toggle('open');
  };
  $('search-input').oninput = (e) => renderList(e.target.value.toLowerCase());
  window.onhashchange = route;
  initTheme();
}

async function loadPosts() {
  try {
    const res = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.user}/${GITHUB_CONFIG.repo}/contents/posts`);
    const files = await res.json();
    const mdFiles = files.filter(f => f.name.endsWith('.md')).reverse();
    
    allPosts = await Promise.all(mdFiles.map(async f => {
      const r = await fetch(f.download_url);
      const text = await r.text();
      return {
        slug: f.name.replace('.md', ''),
        title: parseMeta(text, 'title') || 'Без назви',
        date: parseMeta(text, 'date') || '',
        excerpt: parseMeta(text, 'excerpt') || '',
        content: text
      };
    }));
    renderList();
  } catch(e) { $('posts-container').innerHTML = "Помилка завантаження."; }
}

function renderList(query = '') {
  const filtered = allPosts.filter(p => p.title.toLowerCase().includes(query));
  $('posts-container').innerHTML = filtered.map(p => `
    <div class="post-item" onclick="location.hash='${p.slug}'">
      <div class="post-date">${p.date.split('-')[0] || 'NEW'}</div>
      <div>
        <div class="post-title">${p.title}</div>
        <div class="post-excerpt">${p.excerpt}</div>
      </div>
    </div>
  `).join('');
}

async function route() {
  const hash = window.location.hash.slice(1);
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $('burger-menu').classList.remove('open');
  $('burger-btn').classList.remove('open');

  if (!hash) {
    $('page-home').classList.add('active');
  } else if (hash === 'about') {
    $('page-about').classList.add('active');
  } else {
    const post = allPosts.find(p => p.slug === hash);
    if (post) {
      $('page-post').classList.add('active');
      const md = post.content.replace(/^---[\s\S]*?---\n?/, '');
      const rawHtml = marked.parse(md);
      // БЕЗПЕКА: Санітизація ПІСЛЯ парсингу marked
      $('post-content-display').innerHTML = DOMPurify.sanitize(rawHtml);
      processMedia($('post-content-display'));
    }
  }
}

function processMedia(container) {
  container.querySelectorAll('a').forEach(a => {
    const ytMatch = a.href.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    if (ytMatch) {
      const wrap = document.createElement('div');
      wrap.className = 'youtube-wrap';
      wrap.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytMatch[1]}" allowfullscreen loading="lazy"></iframe>`;
      a.replaceWith(wrap);
    }
  });
}

function parseMeta(text, key) {
  const m = text.match(new RegExp(`${key}:\\s*["']?([^"\\n]+)["']?`));
  return m ? m[1].trim() : null;
}

function toggleTheme() {
  const dark = document.documentElement.getAttribute('data-theme') !== 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  localStorage.setItem('theme', dark ? 'dark' : 'light');
}

function initTheme() {
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
}

function $(id) { return document.getElementById(id); }

window.onload = init;
</script>
</body>
</html>
