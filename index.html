<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Блог Сканера</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>

<style>
body { font-family: system-ui; max-width:720px; margin:auto; padding:20px; background:#fafaf8; color:#111; }
h1 { margin-bottom:20px; }
.nav a { margin-right:10px; cursor:pointer; color:#444; text-decoration:none; }
.post { padding:12px 0; border-bottom:1px solid #ddd; cursor:pointer; }
.tag { display:inline-block; background:#eee; padding:2px 6px; margin-right:4px; font-size:12px; cursor:pointer; }
.hidden { display:none; }
button { margin-bottom:15px; }
</style>
</head>
<body>

<h1>Блог Сканера</h1>

<div class="nav">
  <a onclick="goHome()">Дописи</a>
  <a onclick="openPage('about')">Про мене</a>
</div>

<div id="tags"></div>
<div id="list"></div>

<div id="view" class="hidden">
  <button onclick="goHome()">← назад</button>
  <div id="content"></div>
</div>

<script>
const REPO = "Bov888/my-scanner-blog";

let posts = [];
let pages = {};
let activeTag = null;

// ===== FETCH =====
async function load() {
  try {
    const [p, pg] = await Promise.all([
      loadFolder("posts"),
      loadFolder("pages").catch(()=>[])
    ]);

    posts = p.sort((a,b)=>new Date(b.meta.date||0)-new Date(a.meta.date||0));
    pages = Object.fromEntries(pg.map(x=>[x.slug,x]));

    render();
  } catch(e) {
    document.body.innerHTML="<h2>Помилка завантаження даних</h2><p>Перевір репо і папки</p>";
    console.error(e);
  }
}

async function loadFolder(folder) {
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${folder}`);
  if(!res.ok) throw new Error("Folder not found: "+folder);
  const files = await res.json();
  if(!Array.isArray(files)) throw new Error("Invalid response");

  return (await Promise.all(files.map(async f=>{
    if(!f.name.endsWith(".md")) return null;
    const r = await fetch(f.download_url);
    if(!r.ok) return null;
    const raw = await r.text();

    const fm = raw.match(/^---([\s\S]*?)---/);
    let meta={}, body=raw;
    if(fm){ meta=jsyaml.load(fm[1])||{}; body=raw.replace(/^---[\s\S]*?---\s*/,""); }

    return { slug:f.name.replace(".md",""), meta, body };
  }))).filter(Boolean);
}

// ===== RENDER =====
function render() {
  renderTags();
  renderPosts();
}

function renderTags() {
  const el=document.getElementById("tags");
  const set=new Set();
  posts.forEach(p=>(p.meta.tags||[]).forEach(t=>set.add(t)));

  el.innerHTML="<b>Теги:</b> " +
    `<span class="tag" onclick="setTag(null)">всі</span>` +
    [...set].map(t=>`<span class="tag" onclick="setTag('${t}')">${t}</span>`).join("");
}

function setTag(tag){ activeTag=tag; renderPosts(); }

function renderPosts() {
  const el=document.getElementById("list");
  const filtered = activeTag ? posts.filter(p=>(p.meta.tags||[]).includes(activeTag)) : posts;
  el.innerHTML = filtered.map(p=>`
    <div class="post" data-slug="${p.slug}">
      <b>${p.meta.title||"Без назви"}</b><br>
      ${(p.meta.tags||[]).map(t=>`<span class="tag">${t}</span>`).join("")}
    </div>
  `).join("");

  document.querySelectorAll(".post").forEach(el=>el.onclick=()=>openPost(el.dataset.slug));
}

// ===== VIEW =====
function openPost(slug){
  const post=posts.find(p=>p.slug===slug);
  if(!post) return;
  show(post.body);
}

function openPage(slug){
  const page=pages[slug];
  if(!page) return alert("Сторінка не знайдена");
  show(page.body);
}

function show(md){
  document.getElementById("list").classList.add("hidden");
  document.getElementById("tags").classList.add("hidden");
  document.getElementById("view").classList.remove("hidden");
  document.getElementById("content").innerHTML=marked.parse(md);
}

function goHome(){
  document.getElementById("list").classList.remove("hidden");
  document.getElementById("tags").classList.remove("hidden");
  document.getElementById("view").classList.add("hidden");
}

// ===== START =====
load();
</script>

</body>
</html>
