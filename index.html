<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сканер Блог</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>

<style>
body {
  font-family: system-ui;
  max-width: 720px;
  margin: auto;
  padding: 20px;
  background: #fafaf8;
}

h1 { margin-bottom: 20px; }

.post {
  border-bottom: 1px solid #ddd;
  padding: 12px 0;
  cursor: pointer;
}

.tag {
  display:inline-block;
  background:#eee;
  padding:2px 6px;
  margin-right:4px;
  font-size:12px;
  cursor:pointer;
}

.nav a {
  margin-right: 10px;
  cursor: pointer;
  color: #444;
}

.hidden { display:none; }

button {
  margin-bottom: 15px;
}
</style>
</head>
<body>

<h1>Блог</h1>

<div class="nav">
  <a onclick="goHome()">Дописи</a>
  <a onclick="openPage('about')">Про мене</a>
</div>

<div id="tag-filter"></div>
<div id="posts"></div>

<div id="viewer" class="hidden">
  <button onclick="goHome()">← назад</button>
  <div id="content"></div>
</div>

<script>
const CACHE_KEY = "blog-cache-v1";
const CACHE_TIME = 5 * 60 * 1000; // 5 хв

let allPosts = [];
let allPages = {};
let activeTag = null;

// ===== CACHE =====
function saveCache(data) {
  localStorage.setItem(CACHE_KEY, JSON.stringify({
    time: Date.now(),
    data
  }));
}

function loadCache() {
  const raw = localStorage.getItem(CACHE_KEY);
  if (!raw) return null;

  const parsed = JSON.parse(raw);
  if (Date.now() - parsed.time > CACHE_TIME) return null;

  return parsed.data;
}

// ===== FETCH =====
async function fetchAll() {
  const cached = loadCache();
  if (cached) {
    allPosts = cached.posts;
    allPages = cached.pages;
    renderAll();
    return;
  }

  const [posts, pages] = await Promise.all([
    fetchFolder("posts"),
    fetchFolder("pages")
  ]);

  allPosts = posts.reverse();
  allPages = pages;

  saveCache({ posts: allPosts, pages: allPages });

  renderAll();
}

async function fetchFolder(folder) {
  const res = await fetch(`https://api.github.com/repos/Bov888/my-scanner-blog/contents/${folder}`);
  const files = await res.json();

  const results = await Promise.all(files.map(async f => {
    if (!f.name.endsWith('.md')) return null;

    const r = await fetch(f.download_url);
    if (!r.ok) return null;

    const text = await r.text();

    const match = text.match(/^---([\\s\\S]*?)---/);
    let meta = {};
    let body = text;

    if (match) {
      meta = jsyaml.load(match[1]);
      body = text.replace(/^---[\\s\\S]*?---\\s*/, '');
    }

    return {
      slug: f.name.replace('.md', ''),
      meta,
      body
    };
  }));

  return results.filter(Boolean);
}

// ===== RENDER =====
function renderAll() {
  renderTags();
  renderPosts();
}

function renderTags() {
  const container = document.getElementById('tag-filter');
  const tags = new Set();

  allPosts.forEach(p => (p.meta.tags || []).forEach(t => tags.add(t)));

  container.innerHTML =
    "<b>Теги:</b> " +
    "<span class='tag' onclick='setTag(null)'>всі</span>" +
    [...tags].map(t =>
      `<span class='tag' onclick="setTag('${t}')">${t}</span>`
    ).join('');
}

function setTag(tag) {
  activeTag = tag;
  renderPosts();
}

function renderPosts() {
  const container = document.getElementById('posts');

  const filtered = activeTag
    ? allPosts.filter(p => (p.meta.tags || []).includes(activeTag))
    : allPosts;

  container.innerHTML = filtered.map((p, i) => `
    <div class="post" onclick="openPost(${i})">
      <b>${p.meta.title || "Без назви"}</b><br>
      ${(p.meta.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}
    </div>
  `).join('');
}

// ===== VIEW =====
function openPost(index) {
  const post = allPosts[index];
  showViewer(post.body);
}

function openPage(slug) {
  const page = allPages.find(p => p.slug === slug);
  if (!page) return alert("Сторінка не знайдена");
  showViewer(page.body);
}

function showViewer(content) {
  document.getElementById('posts').classList.add('hidden');
  document.getElementById('tag-filter').classList.add('hidden');
  document.getElementById('viewer').classList.remove('hidden');

  document.getElementById('content').innerHTML = marked.parse(content);
}

function goHome() {
  document.getElementById('posts').classList.remove('hidden');
  document.getElementById('tag-filter').classList.remove('hidden');
  document.getElementById('viewer').classList.add('hidden');
}

// старт
fetchAll();
</script>

</body>
</html>
