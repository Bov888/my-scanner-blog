:root {
  --bg: #fafaf8; --surface: #f4f3ef; --text: #1a1917; --muted: #6b6963;
  --accent: #2d5a27; --accent-light: #e8f0e6; --border: #e2e1db; --max: 680px;
  --menu-height: 0px;
}
[data-theme="dark"] {
  --bg: #141412; --surface: #1e1d1b; --text: #e8e6e0; --muted: #8a8880;
  --accent: #6ab05f; --accent-light: #1e2e1c; --border: #2e2d2a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 18px; }
body { background: var(--bg); color: var(--text); font-family: 'Literata', Georgia, serif; font-weight: 300; line-height: 1.75; min-height: 100vh; }

/* ХЕДЕР */
header { border-bottom: 1px solid var(--border); padding: 0.9rem 1.5rem; position: sticky; top: 0; background: var(--bg); z-index: 100; transition: border-bottom-color 0.15s; }
header.menu-open { border-bottom-color: transparent; }
.header-inner { max-width: var(--max); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }

.header-right { display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }

.theme-toggle { background: var(--accent-light); border: 1px solid var(--accent); color: var(--accent); font-size: 0.6rem; font-family: 'JetBrains Mono', monospace; cursor: pointer; padding: 0.35rem 0.65rem; border-radius: 2px; transition: opacity 0.2s; letter-spacing: 0.06em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 0.3rem; white-space: nowrap; flex-shrink: 0; line-height: 1; }
.theme-toggle:hover { opacity: 0.7; }

.burger-btn { background: none; border: none; cursor: pointer; padding: 4px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; flex-shrink: 0; }
.burger-btn span { display: block; width: 20px; height: 1.5px; background: var(--muted); border-radius: 1px; transition: all 0.25s; }
.burger-btn.open span:nth-child(1) { transform: rotate(45deg) translate(4.5px, 4.5px); }
.burger-btn.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.burger-btn.open span:nth-child(3) { transform: rotate(-45deg) translate(4.5px, -4.5px); }

/* Бургер меню */
.burger-menu { display: none; background: var(--bg); border-bottom: 1px solid var(--border); padding: 0.75rem; }
.burger-menu.open { display: block; }
.burger-menu-inner { display: grid; grid-template-columns: 1fr; gap: 0.5rem; max-width: 320px; margin: 0 auto; }
.burger-menu a { background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 0.8rem; cursor: pointer; transition: all 0.2s; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); display: block; text-decoration: none; }
.burger-menu a:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

/* Main зсувається через CSS змінну */

.page.active { display: block; }

.tag-filter:hover { border-color: var(--accent); color: var(--accent); }
.tag-filter.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }

.post-item { display: grid; grid-template-columns: 80px 1fr; gap: 1.2rem; padding: 1.5rem 0; border-bottom: 1px solid var(--border); cursor: pointer; transition: opacity 0.2s; }
.post-item:first-of-type { border-top: 1px solid var(--border); }
.post-item:hover { opacity: 0.7; }

.post-tag { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase; background: var(--accent-light); color: var(--accent); padding: 0.15rem 0.5rem; border-radius: 2px; margin-top: 0.5rem; cursor: pointer; transition: opacity 0.2s; border: none; }
.post-tag:hover { opacity: 0.7; }

/* ДОПИС */

.back-btn:hover { color: var(--accent); }
.post-header { padding: 0 0 2rem; border-bottom: 1px solid var(--border); margin-bottom: 2.5rem; }
.post-header h2 { font-size: 1.4rem; font-weight: 300; line-height: 1.3; letter-spacing: -0.02em; margin-bottom: 1rem; }
.post-meta { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); letter-spacing: 0.05em; display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
.post-meta-tag { background: var(--accent-light); color: var(--accent); padding: 0.15rem 0.5rem; border-radius: 2px; cursor: pointer; transition: opacity 0.2s; border: none; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; letter-spacing: 0.05em; }

/* ВМІСТ */
.post-content { font-size: 1rem; line-height: 1.8; }
.post-content h1,.post-content h2,.post-content h3 { font-weight: 400; line-height: 1.3; margin: 2rem 0 0.8rem; letter-spacing: -0.01em; }
.post-content h1 { font-size: 1.3rem; }
.post-content h2 { font-size: 1.1rem; }
.post-content h3 { font-size: 0.95rem; }

.post-content ul,.post-content ol { margin: 0 0 1.2rem 1.5rem; }
.post-content li { margin-bottom: 0.4rem; }
.post-content blockquote { border-left: 3px solid var(--accent); padding-left: 1.2rem; color: var(--muted); font-style: italic; margin: 1.5rem 0; }
.post-content code { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; background: var(--surface); padding: 0.15rem 0.4rem; border-radius: 2px; }
.post-content pre { background: var(--surface); padding: 1.2rem; border-radius: 4px; overflow-x: auto; margin-bottom: 1.2rem; }
.post-content pre code { background: none; padding: 0; }
.post-content img { max-width: 100%; height: auto; border-radius: 4px; margin: 1rem 0; }
.post-content hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
.post-content a { color: var(--accent); text-decoration: underline; text-decoration-color: var(--accent-light); text-underline-offset: 3px; transition: text-decoration-color 0.2s; }
.post-content a:hover { text-decoration-color: var(--accent); }

/* ПОДІЛИТИСЬ */
.post-actions { display: flex; align-items: center; gap: 1rem; margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border); }
.share-btn { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: none; border: 1px solid var(--border); cursor: pointer; padding: 0.4rem 0.8rem; border-radius: 2px; display: flex; align-items: center; gap: 0.4rem; transition: all 0.2s; }
.share-btn:hover { border-color: var(--accent); color: var(--accent); }
.share-btn.copied { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

/* YOUTUBE / ВІДЕО */
.youtube-wrap { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin: 1.5rem 0; background: #000; }
.youtube-wrap iframe, .youtube-wrap video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

/* СТАНИ */
.loading { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--muted); }
.empty-state { padding: 3rem 0; text-align: center; }

/* КНОПКА ВГОРУ */

/* ФУТЕР */

</style>
</head>

<script>
const renderer = new marked.Renderer();
renderer.html = token => typeof token === 'object' ? (token.text || token.raw || '') : token;
marked.use({ breaks: true, gfm: true, renderer });

window.addEventListener('DOMContentLoaded', initApp);

const GITHUB_USER = 'Bov888';
const GITHUB_REPO = 'my-scanner-blog';
const POSTS_FOLDER = 'posts';
const SITE_TITLE = 'Як стати успішним сканером';
const CACHE_TTL = 5 * 60 * 1000;
const MONTHS = ["СІЧ","ЛЮТ","БЕР","КВІ","ТРА","ЧЕР","ЛИП","СЕР","ВЕР","ЖОВ","ЛИС","ГРУ"];

let postsCache = {}, postsCachedAt = null, allPosts = [], activeTag = null, searchQuery = '', searchDebounce = null;
const $ = id => document.getElementById(id);
const els = {};

function initApp() {
  Object.assign(els, {
    header: document.querySelector('header'), main: $('main'), themeToggle: $('theme-toggle'),
    burgerBtn: $('burger-btn'), burgerMenu: $('burger-menu'), burgerMenuInner: document.querySelector('.burger-menu-inner'),
    postsContainer: $('posts-container'), tagFilters: $('tag-filters'), searchInput: $('search-input'),
    searchClear: $('search-clear'), scrollTop: $('scroll-top'), shareBtn: $('share-btn'),
    postTitle: $('post-title-display'), postDate: $('post-date-display'), postTime: $('post-reading-time'),
    postTag: $('post-tag-display'), postContent: $('post-content-display'), pageTitle: $('page-title-display'),
    pageContent: $('page-content-display'), aboutTags: $('about-tags'),
  });

  els.aboutTags.innerHTML = ABOUT_TAGS.map(tag => `<button class="about-tag" data-tag="${tag}">${tag}</button>`).join('');
  initTheme(); initBurger(); initScrollTop(); initEvents();
  Promise.all([loadPages(), routeHandler()]);
}

function initTheme() {
  const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  if (theme === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); els.themeToggle.textContent = '☀ тема'; }
}
function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  els.themeToggle.textContent = isDark ? '☾ тема' : '☀ тема';
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
}

function initBurger() {
  els.burgerBtn.addEventListener('click', () => {
    const isOpen = els.burgerMenu.classList.toggle('open');
    els.burgerBtn.classList.toggle('open', isOpen);
    els.header.classList.toggle('menu-open', isOpen);
    document.documentElement.style.setProperty('--menu-height', isOpen ? `${els.burgerMenu.offsetHeight}px` : '0px');
  });
}
function closeBurger() {
  els.burgerMenu.classList.remove('open'); els.burgerBtn.classList.remove('open');
  els.header.classList.remove('menu-open'); document.documentElement.style.setProperty('--menu-height', '0px');
}

function initScrollTop() {
  window.addEventListener('scroll', () => els.scrollTop.classList.toggle('visible', window.scrollY > 400), { passive: true });
  els.scrollTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
}

function initEvents() {
  $('site-title').addEventListener('click', () => { navigateTo('home'); closeBurger(); });
  els.themeToggle.addEventListener('click', toggleTheme);
  els.searchInput.addEventListener('input', e => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => { searchQuery = e.target.value.toLowerCase(); renderPostsList(); }, 200);
  });
  $('back-btn-post').addEventListener('click', () => navigateTo('home'));
  $('back-btn-page').addEventListener('click', () => navigateTo('home'));
  els.shareBtn.addEventListener('click', sharePost);
  window.addEventListener('hashchange', routeHandler);
}

function setPageTitle(title) { document.title = title ? `${title} · ${SITE_TITLE}` : SITE_TITLE; }
function calcReadingTime(text) { return `${Math.max(1, Math.round(text.split(/\s+/).length / 200))} хв`; }
function safeHTML(html) { return window.DOMPurify ? DOMPurify.sanitize(html) : html; }
function decodeHtmlEntities(str) { return str.replace(/</g, '<').replace(/>/g, '>'); }
function parseMeta(text, key) { const m = text.match(new RegExp(`${key}:\\s*"?([^"\\n]+)"?`)); return m ? m[1].trim() : null; }

function sharePost() {
  const url = window.location.href;
  if (navigator.share) navigator.share({ title: els.postTitle.textContent, url });
  else navigator.clipboard.writeText(url).then(() => { els.shareBtn.textContent = '✓ скопійовано'; setTimeout(() => els.shareBtn.textContent = '↗ поділитись', 2000); });
}

function navigateTo(page, slug) { window.location.hash = slug || (page === 'home' ? '' : page); }

function routeHandler() {
  const hash = window.location.hash.replace('#', ''); closeBurger();
  if (!hash || hash === 'home') { showPage('home'); setPageTitle(''); loadPosts(); }
  else if (hash === 'about') showPage('about');
  else if (hash.startsWith('page-')) openPageBySlug(hash.replace('page-', ''));
  else openPostBySlug(hash);
}

function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + pageId));
  window.scrollTo(0, 0);
}

function filterByTag(tag) {
  activeTag = (activeTag === tag) ? null : tag;
  document.querySelectorAll('.tag-filter').forEach(btn => btn.classList.toggle('active', btn.dataset.tag === activeTag));
  renderPostsList();
}

function renderPostsList() {
  let filtered = activeTag ? allPosts.filter(p => p.tag === activeTag) : allPosts;
  if (searchQuery) filtered = filtered.filter(p => p.title.toLowerCase().includes(searchQuery));
  
  els.postsContainer.innerHTML = filtered.map(p => `
    <div class="post-item" onclick="navigateTo('post', '${p.slug}')">
      <div class="post-date">${p.displayDate}</div>
      <div>
        <div class="post-title">${p.title}</div>
        <div class="post-excerpt">${p.excerpt}</div>
        <button class="post-tag" onclick="event.stopPropagation(); filterByTag('${p.tag}')">${p.tag}</button>
      </div>
    </div>
  `).join('') || '<p class="empty-state">Нічого не знайдено</p>';
}

async function loadPosts() {
  if (postsCachedAt && Date.now() - postsCachedAt < CACHE_TTL) return renderPostsList();
  try {
    const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${POSTS_FOLDER}`);
    const files = (await res.json()).filter(f => f.name.endsWith('.md')).reverse();
    allPosts = await Promise.all(files.map(async file => {
      const text = await (await fetch(file.download_url)).text();
      const slug = file.name.replace('.md', '');
      postsCache[slug] = { text };
      const date = new Date(parseMeta(text, 'date'));
      return { 
        slug, title: parseMeta(text, 'title'), excerpt: parseMeta(text, 'excerpt'), 
        tag: parseMeta(text, 'tag'), displayDate: `${MONTHS[date.getMonth()]}<br>${date.getFullYear()}` 
      };
    }));
    const tags = [...new Set(allPosts.map(p => p.tag))];
    els.tagFilters.innerHTML = tags.map(tag => `<button class="tag-filter" data-tag="${tag}" onclick="filterByTag('${tag}')">${tag}</button>`).join('');
    postsCachedAt = Date.now(); renderPostsList();
  } catch(e) { console.error(e); }
}

async function loadPages() {
  try {
    const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/pages`);
    const files = (await res.json()).filter(f => f.name.endsWith('.md'));
    files.forEach(file => {
      const slug = file.name.replace('.md', '');
      const a = document.createElement('a'); a.textContent = slug.replace(/-/g, ' '); a.href = `#page-${slug}`;
      els.burgerMenuInner.appendChild(a);
    });
  } catch(e) {}
}

async function openPageBySlug(slug) {
  showPage('page'); els.pageTitle.textContent = 'Завантаження...';
  try {
    const text = await (await fetch(`https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/pages/${slug}.md`)).text();
    els.pageTitle.textContent = parseMeta(text, 'title') || slug;
    els.pageContent.innerHTML = safeHTML(marked.parse(text.replace(/^---[\s\S]*?---\n?/, '')));
  } catch(e) { els.pageTitle.textContent = 'Не знайдено'; }
}

async function openPostBySlug(slug) {
  showPage('post'); els.postContent.innerHTML = 'Завантаження...';
  try {
    const text = postsCache[slug]?.text || await (await fetch(`https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${POSTS_FOLDER}/${slug}.md`)).text();
    const title = parseMeta(text, 'title'), body = text.replace(/^---[\s\S]*?---\n?/, '');
    els.postTitle.textContent = title; els.postTime.textContent = calcReadingTime(body);
    els.postTag.textContent = parseMeta(text, 'tag');
    els.postContent.innerHTML = safeHTML(marked.parse(decodeHtmlEntities(body)));
    setPageTitle(title);

    // ОБРОБКА МЕДІА (YOUTUBE, SPOTIFY, CLOUDINARY)
    els.postContent.querySelectorAll('a').forEach(link => {
      const href = link.getAttribute('href') || '';
      const container = document.createElement('div');
      container.style.margin = '1.5rem 0';

       // 1. CLOUDINARY (ПОВНЕ ВИПРАВЛЕННЯ)
      if (href.includes('cloudinary.com')) {
        // Витягуємо чисте розширення (без параметрів після ?)
        const extension = href.split(/[#?]/)[0].split('.').pop().toLowerCase();
        const audioExts = ['mp3', 'wav', 'ogg', 'm4a', 'flac', 'aac'];
        const videoExts = ['mp4', 'mov', 'webm', 'ogv'];

        if (audioExts.includes(extension)) {
          // Тільки АУДІО плеєр
          container.innerHTML = `
            <div style="margin: 1rem 0; background: var(--surface); padding: 10px; border-radius: 8px; border: 1px solid var(--border);">
              <audio controls style="width:100%; display: block;">
                <source src="${href}">
                Ваш браузер не підтримує аудіо.
              </audio>
            </div>`;
        } else if (videoExts.includes(extension) || href.includes('player.cloudinary.com')) {
          // Тільки ВІДЕО плеєр (16:9)
          container.className = 'youtube-wrap'; 
          container.innerHTML = `<video controls playsinline style="position:absolute;top:0;left:0;width:100%;height:100%;border-radius:8px;background:#000;"><source src="${href}">Ваш браузер не підтримує відео.</video>`;
        } else {
          // Якщо розширення немає в списку, але це cloudinary (наприклад /video/upload/...)
          // Перевіряємо чи немає слова /video/ у самому шляху, якщо немає - вважаємо аудіо
          if (href.includes('/video/') && !href.includes('/raw/')) {
             container.className = 'youtube-wrap';
             container.innerHTML = `<video controls playsinline style="position:absolute;top:0;left:0;width:100%;height:100%;border-radius:8px;background:#000;"><source src="${href}"></video>`;
          } else {
             container.innerHTML = `<audio controls style="width:100%; margin: 1rem 0;"><source src="${href}"></audio>`;
          }
        }
        link.parentNode.replaceChild(container, link);
      }

      // 2. YOUTUBE
      else if (href.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/)) {
        const id = href.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/)[1];
        container.className = 'youtube-wrap';
        container.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}" allowfullscreen loading="lazy"></iframe>`;
        link.parentNode.replaceChild(container, link);
      }

      // 3. SPOTIFY
      else if (href.includes('open.spotify.com')) {
        const sp = href.match(/spotify\.com\/(track|episode|playlist|show)\/([a-zA-Z0-9]+)/);
        if (sp) {
          container.innerHTML = `<iframe style="border-radius:12px" src="https://open.spotify.com/embed/${sp[1]}/${sp[2]}" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`;
          link.parentNode.replaceChild(container, link);
        }
      }
    });
  } catch(e) { console.error(e); }
}

if (window.location.pathname.startsWith('/admin')) {
  const s = document.createElement('script'); s.src = 'https://identity.netlify.com/v1/netlify-identity-widget.js';
  document.head.appendChild(s);
}
</script>
