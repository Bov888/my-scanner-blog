<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Як стати успішним сканером</title>
    <style>
        /* 1. ГЛОБАЛЬНІ НАЛАШТУВАННЯ */
        :root {
            --primary-green: #4a6741;
            --light-bg: #f9f9f9;
            --text-main: #1a1a1a;
            --text-muted: #666;
            --border-color: #eee;
        }

        body {
            font-family: 'Georgia', serif;
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* 2. ВИРАЗНА ШАПКА (HEADER) */
        .main-header {
            padding: 25px 0;
            background-color: var(--light-bg);
            border-bottom: 3px solid var(--primary-green); /* Акцентна лінія */
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo a {
            font-size: 24px;
            font-weight: 900; /* Максимальна виразність */
            text-decoration: none;
            color: var(--text-main);
            letter-spacing: -0.5px;
            text-transform: lowercase; /* Сучасний стиль */
        }

        .logo a span {
            color: var(--primary-green);
        }

        .main-nav a {
            text-decoration: none;
            color: var(--text-muted);
            font-family: sans-serif;
            font-size: 13px;
            font-weight: 700;
            margin-left: 20px;
            letter-spacing: 1.5px;
            transition: color 0.3s;
        }

        .main-nav a:hover {
            color: var(--primary-green);
        }

        /* 3. КОНТЕНТНА ЧАСТИНА */
        .hero-section {
            margin-top: 80px;
            margin-bottom: 60px;
        }

        .category-tag {
            font-family: sans-serif;
            font-size: 12px;
            color: var(--primary-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            display: block;
            margin-bottom: 15px;
        }

        .main-title {
            font-size: 52px;
            line-height: 1.1;
            font-weight: 400; /* Полегшуємо шрифт, щоб не перевантажувати */
            margin: 0 0 25px 0;
        }

        .main-title em {
            color: var(--primary-green);
            font-style: italic;
        }

        .subtitle {
            font-size: 22px;
            color: var(--text-muted);
            max-width: 600px;
        }

        .divider {
            border: 0;
            border-top: 1px solid var(--border-color);
            margin: 50px 0;
        }

        /* 4. СПИСОК ДОПИСІВ */
        .post-list-item {
            display: flex;
            gap: 50px;
            align-items: flex-start;
        }

        .post-meta {
            font-family: sans-serif;
            font-size: 13px;
            color: #999;
            font-weight: 700;
            min-width: 80px;
            padding-top: 8px;
        }

        .post-content h2 {
            font-size: 26px;
            margin: 0 0 10px 0;
            font-weight: 400;
        }

        .post-content p {
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .badge {
            display: inline-block;
            background: #f0f4ef;
            color: var(--primary-green);
            padding: 5px 12px;
            font-family: sans-serif;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 4px;
        }

        /* Адаптивність для мобілок */
        @media (max-width: 600px) {
            .main-title { font-size: 36px; }
            .header-content { flex-direction: column; gap: 15px; }
            .post-list-item { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="#">як стати <span>успішним сканером</span></a>
                </div>
                <nav class="main-nav">
                    <a href="#">ДОПИСИ</a>
                    <a href="#">ПРО МЕНЕ</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="hero-section">
            <span class="category-tag">дописи</span>
            <h1 class="main-title">Нотатки людини з <em>широкими інтересами</em></h1>
            <p class="subtitle">Про РКМ, автоматизацію та життя сканера.</p>
        </section>

        <hr class="divider">

        <section class="post-list">
            <div class="post-list-item">
                <div class="post-meta">КВІТ 2026</div>
                <div class="post-content">
                    <h2>Як я створював цей сайт</h2>
                    <p>Натисніть, щоб прочитати історію розробки та вибору інструментів...</p>
                    <span class="badge">допис</span>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
