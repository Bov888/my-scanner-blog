<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Як стати успішним сканером</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,300;0,400;0,500;1,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fafaf8; --surface: #f4f3ef; --text: #1a1917; --muted: #6b6963; --accent: #2d5a27; --accent-light: #e8f0e6; --border: #e2e1db; --max: 680px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Literata', Georgia, serif; font-weight: 300; line-height: 1.75; min-height: 100vh; }
  header { border-bottom: 1px solid var(--border); padding: 2rem 1.5rem; }
  .header-inner { max-width: var(--max); margin: 0 auto; display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .site-title { font-weight: 500; font-size: 1.1rem; color: var(--text); text-decoration: none; }
  .site-title span { color: var(--accent); }
  nav { display: flex; gap: 1.5rem; }
  nav a { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--muted); text-decoration: none; text-transform: uppercase; cursor: pointer; }
  main { max-width: var(--max); margin: 0 auto; padding: 3rem 1.5rem 6rem; }
  .page { display: none; }
  .page.active { display: block; }
  .hero { padding: 3rem 0 4rem; border-bottom: 1px solid var(--border); margin-bottom: 3.5rem; }
  .hero-label { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--accent); text-transform: uppercase; margin-bottom: 1.2rem; }
  .hero h1 { font-size: 2.4rem; font-weight: 300; line-height: 1.25; margin-bottom: 1.2rem; }
  .hero h1 em { font-style: italic; color: var(--accent); }
  .post-item { display: grid; grid-template-columns: 80px 1fr; gap: 1.2rem; padding: 1.5rem 0; border-bottom: 1px solid var(--border); cursor: pointer; text-decoration: none; color: inherit; }
  .post-date { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); }
  .post-title { font-size: 1.05rem; font-weight: 400; margin-bottom: 0.4rem; }
  .post-tag { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; background: var(--accent-light); color: var(--accent); padding: 0.15rem 0.5rem; margin-top: 0.5rem; }
  footer { border-top: 1px solid var(--border); padding: 2rem 1.5rem; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); text-transform: uppercase; }
  @media (max-width: 600px) { .post-item { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="site-title" href="#" onclick="showPage('home')">Як стати <span>успішним сканером</span></a>
    <nav>
      <a onclick="showPage('home')">Дописи</a>
      <a onclick="showPage('about')">Про мене</a>
    </nav>
  </div>
</header>

<main>
  <div id="page-home" class="page active">
    <div class="hero">
      <div class="hero-label">Дописи</div>
      <h1>Нотатки людини з <em>широкими інтересами</em></h1>
      <p>Про PKM, автоматизацію та життя сканера.</p>
    </div>
    <div id="posts-container">
      <p style="font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--muted);">Завантаження дописів...</p>
    </div>
  </div>

  <div id="page-about" class="page">
    <h2>Про мене</h2>
    <p>7+ років у телекомі. Захоплююсь PKM, ШІ та бігом. Цей блог — мої нотатки вголос.</p>
  </div>
</main>

<footer><p>Успішний Сканер &copy; 2026</p></footer>

<script>
  function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + pageId).classList.add('active');
    window.scrollTo(0, 0);
  }

  // ФУНКЦІЯ АВТОМАТИЧНОГО ЗАВАНТАЖЕННЯ ДОПИСІВ
  async function loadPosts() {
    const container = document.querySelector('#posts-container');
    
    try {
      // Запит до вашого репозиторію
      const response = await fetch('https://api.github.com/repos/uspishnyskaner/uspishnyskaner.github.io/contents/posts');
      if (!response.ok) throw new Error('Поки що дописів немає');
      
      const files = await response.json();
      container.innerHTML = ''; // Очищуємо текст завантаження

      // Сортуємо файли, щоб нові були зверху (за назвою файлу, де є дата)
      files.reverse();

      for (const file of files) {
        if (file.name.endsWith('.md')) {
          const contentRes = await fetch(file.download_url);
          const text = await contentRes.text();
          
          // Парсинг заголовка, опису та дати
          const title = text.match(/title:\s*"(.*)"/)?.[1] || text.match(/title:\s*(.*)/)?.[1] || "Без назви";
          const excerpt = text.match(/excerpt:\s*"(.*)"/)?.[1] || text.match(/excerpt:\s*(.*)/)?.[1] || "Натисніть, щоб прочитати...";
          const dateStr = text.match(/date:\s*(.*)/)?.[1] || "";
          const tag = text.match(/tag:\s*"(.*)"/)?.[1] || text.match(/tag:\s*(.*)/)?.[1] || "ДОПИС";
          
          const date = new Date(dateStr);
          const monthNames = ["СІЧ", "ЛЮТ", "БЕР", "КВІТ", "ТРА", "ЧЕР", "ЛИП", "СЕР", "ВЕР", "ЖОВ", "ЛИС", "ГРУ"];
          const displayDate = isNaN(date.getTime()) ? "НОВЕ" : `${monthNames[date.getMonth()]}<br>${date.getFullYear()}`;

          const postHTML = `
            <a class="post-item" href="${file.html_url}" target="_blank">
              <div class="post-date">${displayDate}</div>
              <div>
                <div class="post-title">${title}</div>
                <div class="post-excerpt">${excerpt}</div>
                <span class="post-tag">${tag}</span>
              </div>
            </a>
          `;
          container.insertAdjacentHTML('beforeend', postHTML);
        }
      }
    } catch (e) {
      container.innerHTML = '<p style="font-family: \'JetBrains Mono\', monospace; font-size: 0.7rem; color: var(--muted);">Поки що тут порожньо. Створіть перший допис в адмінці!</p>';
    }
  }

  // Запуск
  loadPosts();

  // Логіка для входу в адмінку
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
</body>
</html>
