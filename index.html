<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Як стати успішним сканером</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,300;0,400;0,500;1,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root { 
    --bg: #fafaf8; 
    --surface: #f4f3ef; 
    --text: #1a1917; 
    --muted: #6b6963; 
    --accent: #2d5a27; 
    --accent-light: #e8f0e6; 
    --border: #e2e1db; 
    --max: 680px; 
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body { 
    background: var(--bg); 
    color: var(--text); 
    font-family: 'Literata', Georgia, serif; 
    font-weight: 300; 
    line-height: 1.75; 
    min-height: 100vh; 
  }

  header { border-bottom: 1px solid var(--border); padding: 2rem 1.5rem; }
  .header-inner { max-width: var(--max); margin: 0 auto; display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  
  .site-title { font-weight: 500; font-size: 1.1rem; color: var(--text); text-decoration: none; }
  .site-title span { color: var(--accent); }
  
  nav { display: flex; gap: 1.5rem; }
  nav a { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--muted); text-decoration: none; text-transform: uppercase; cursor: pointer; }

  main { max-width: var(--max); margin: 0 auto; padding: 3rem 1.5rem 6rem; }
  .page { display: none; }
  .page.active { display: block; }

  /* Головна сторінка */
  .hero { padding: 3rem 0 4rem; border-bottom: 1px solid var(--border); margin-bottom: 3.5rem; }
  .hero-label { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--accent); text-transform: uppercase; margin-bottom: 1.2rem; }
  .hero h1 { font-size: 2.4rem; font-weight: 300; line-height: 1.25; margin-bottom: 1.2rem; }
  .hero h1 em { font-style: italic; color: var(--accent); }

  /* Список дописів */
  .post-item { display: grid; grid-template-columns: 80px 1fr; gap: 1.2rem; padding: 1.5rem 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .post-date { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); padding-top: 0.3rem; }
  .post-title { font-size: 1.2rem; font-weight: 400; margin-bottom: 0.4rem; color: var(--text); }
  .post-excerpt { font-size: 0.95rem; color: var(--muted); margin-bottom: 0.8rem; }
  .post-tag { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; background: var(--accent-light); color: var(--accent); padding: 0.15rem 0.5rem; text-transform: uppercase; }

  /* Сторінка читання допису */
  .back-btn { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); background: none; border: none; cursor: pointer; margin-bottom: 2rem; text-transform: uppercase; display: block; }
  
  /* СТИЛІ ДЛЯ ТЕКСТУ ДОПИСУ */
  .post-content h2, .post-content h3 { font-weight: 400; margin: 2rem 0 1rem; color: var(--text); }
  .post-content p { margin-bottom: 1.5rem; }

  /* Налаштування для картинок з можливістю ресайзу */
  .post-content img {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 2.5rem auto;
    border-radius: 8px;
    resize: both; /* Дозволяє тягнути за кут */
    overflow: auto; /* Потрібно для роботи resize */
    border: 1px solid transparent;
    transition: border 0.3s;
  }
  .post-content img:hover {
    border: 1px dashed var(--accent);
    cursor: nwse-resize;
  }

  /* СТИЛІ ДЛЯ СПИСКІВ (БУЛЕТІВ) */
  .post-content ul, .post-content ol {
    margin-bottom: 2rem;
    padding-left: 2rem;
  }
  .post-content ul li, .post-content ol li {
    margin-bottom: 1.2rem; /* Великий відступ між пунктами, як ви хотіли */
    padding-left: 0.5rem;
  }

  footer { border-top: 1px solid var(--border); padding: 2rem 1.5rem; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); text-transform: uppercase; }

  @media (max-width: 600px) {
    .post-item { grid-template-columns: 1fr; }
    .hero h1 { font-size: 1.8rem; }
  }
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <a class="site-title" href="#" onclick="showPage('home')">Як стати <span>успішним сканером</span></a>
    <nav>
      <a onclick="showPage('home')">Дописи</a>
      <a onclick="showPage('about')">Про мене</a>
    </nav>
  </div>
</header>

<main>
  <div id="page-home" class="page active">
    <div class="hero">
      <div class="hero-label">Дописи</div>
      <h1>Нотатки людини з <em>широкими інтересами</em></h1>
      <p>Про PKM, автоматизацію та життя сканера.</p>
    </div>
    <div id="posts-container">
      <p style="font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--muted);">Завантаження дописів...</p>
    </div>
  </div>

  <div id="page-post-view" class="page">
    <button class="back-btn" onclick="showPage('home')">← до списку</button>
    <article id="full-post-content" class="post-content">
      </article>
  </div>
