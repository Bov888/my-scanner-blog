<style>
:root {
  --bg: #fafaf8; --surface: #f4f3ef; --text: #1a1917; --muted: #6b6963;
  --accent: #2d5a27; --accent-light: #e8f0e6; --border: #e2e1db; --max: 680px;
  --menu-height: 0px;
}
[data-theme="dark"] {
  --bg: #141412; --surface: #1e1d1b; --text: #e8e6e0; --muted: #8a8880;
  --accent: #6ab05f; --accent-light: #1e2e1c; --border: #2e2d2a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 18px; }
body { background: var(--bg); color: var(--text); font-family: 'Literata', Georgia, serif; font-weight: 300; line-height: 1.75; min-height: 100vh; }

/* ХЕДЕР */
header { border-bottom: 1px solid var(--border); padding: 0.9rem 1.5rem; position: sticky; top: 0; background: var(--bg); z-index: 100; transition: border-bottom-color 0.15s; }
header.menu-open { border-bottom-color: transparent; }
.header-inner { max-width: var(--max); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.site-title { font-weight: 500; font-size: 1rem; color: var(--text); cursor: pointer; letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.4rem; white-space: nowrap; flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; line-height: 1; background: none; border: none; font-family: inherit; }
.site-title span { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }

.theme-toggle { background: var(--accent-light); border: 1px solid var(--accent); color: var(--accent); font-size: 0.6rem; font-family: 'JetBrains Mono', monospace; cursor: pointer; padding: 0.35rem 0.65rem; border-radius: 2px; transition: opacity 0.2s; letter-spacing: 0.06em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 0.3rem; white-space: nowrap; flex-shrink: 0; line-height: 1; }
.theme-toggle:hover { opacity: 0.7; }

.burger-btn { background: none; border: none; cursor: pointer; padding: 4px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; flex-shrink: 0; }
.burger-btn span { display: block; width: 20px; height: 1.5px; background: var(--muted); border-radius: 1px; transition: all 0.25s; }
.burger-btn.open span:nth-child(1) { transform: rotate(45deg) translate(4.5px, 4.5px); }
.burger-btn.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.burger-btn.open span:nth-child(3) { transform: rotate(-45deg) translate(4.5px, -4.5px); }

.burger-menu { display: none; background: var(--bg); border-bottom: 1px solid var(--border); padding: 0.75rem; }
.burger-menu.open { display: block; }
.burger-menu-inner { display: grid; grid-template-columns: 1fr; gap: 0.5rem; max-width: 320px; margin: 0 auto; }
.burger-menu a { background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 0.8rem; cursor: pointer; transition: all 0.2s; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); display: block; text-decoration: none; }
.burger-menu a:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

main { max-width: var(--max); margin: 0 auto; padding: calc(3rem + var(--menu-height)) 1.5rem 6rem; transition: padding-top 0.2s ease; }

.page { display: none; }
.page.active { display: block; }

@media (max-width: 600px) {
  html { font-size: 16px; }
  header { padding: 0.75rem 1rem; }

/* ПОШУК */

.post-title { font-size: 1.05rem; font-weight: 400; line-height: 1.4; margin-bottom: 0.4rem; }

.post-tag { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase; background: var(--accent-light); color: var(--accent); padding: 0.15rem 0.5rem; border-radius: 2px; margin-top: 0.5rem; cursor: pointer; border: none; }

/* ДОПИС */
.back-btn { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 2.5rem; display: flex; align-items: center; gap: 0.4rem; }
.post-header { padding: 0 0 2rem; border-bottom: 1px solid var(--border); margin-bottom: 2.5rem; }
.post-header h2 { font-size: 1.4rem; font-weight: 300; line-height: 1.3; letter-spacing: -0.02em; margin-bottom: 1rem; }
.post-meta { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); letter-spacing: 0.05em; display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
.post-meta-tag { background: var(--accent-light); color: var(--accent); padding: 0.15rem 0.5rem; border-radius: 2px; border: none; font-family: inherit; font-size: 0.65rem; cursor: pointer; }

/* ВМІСТ */
.post-content { font-size: 1rem; line-height: 1.8; }
.post-content a { color: var(--accent); text-decoration: underline; text-decoration-color: var(--accent-light); text-underline-offset: 3px; }
.youtube-wrap { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 4px; margin: 1.5rem 0; }
.youtube-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

.scroll-top { position: fixed; bottom: 2rem; right: 1.5rem; background: var(--accent); color: var(--bg); border: none; cursor: pointer; width: 36px; height: 36px; border-radius: 2px; display: none; align-items: center; justify-content: center; z-index: 50; }
.scroll-top.visible { display: flex; }

footer { border-top: 1px solid var(--border); padding: 2rem 1.5rem; }
footer p { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; text-align: center; }
</style>
</head>

<script>
// Ініціалізація marked
const renderer = new marked.Renderer();
renderer.html = token => (token.text || token.raw || '');
marked.use({ breaks: true, gfm: true, renderer });

const GITHUB_USER = 'Bov888';
const GITHUB_REPO = 'my-scanner-blog';
const POSTS_FOLDER = 'posts';
const MONTHS = ["СІЧ","ЛЮТ","БЕР","КВІ","ТРА","ЧЕР","ЛИП","СЕР","ВЕР","ЖОВ","ЛИС","ГРУ"];
const MONTHS_UA = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];

let allPosts = [];
let postsCache = {};
let activeTag = null;
let searchQuery = '';

const $ = id => document.getElementById(id);
const els = {
  postsContainer: $('posts-container'),
  tagFilters: $('tag-filters'),
  searchInput: $('search-input'),
  postContent: $('post-content-display'),
  postTitle: $('post-title-display'),
  postDate: $('post-date-display'),
  postTag: $('post-tag-display'),
  postTime: $('post-reading-time')
};

// --- ОСНОВНА ЛОГІКА ---
async function initApp() {
  initTheme();
  initBurger();
  initEvents();
  routeHandler();
}

function initTheme() {
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  $('theme-toggle').onclick = () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  };
}

function initBurger() {
  $('burger-btn').onclick = () => {
    $('burger-menu').classList.toggle('open');
    $('burger-btn').classList.toggle('open');
  };
}

function initEvents() {
  $('site-title').onclick = () => navigateTo('home');
  els.searchInput.oninput = (e) => {
    searchQuery = e.target.value.toLowerCase();
    renderPostsList();
  };
  $('back-btn-post').onclick = () => navigateTo('home');
  window.onhashchange = routeHandler;
}

function routeHandler() {
  const hash = window.location.hash.replace('#', '');
  if (!hash || hash === 'home') { showPage('home'); loadPosts(); }
  else if (hash === 'about') { showPage('about'); }
  else { openPostBySlug(hash); }
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $(`page-${id}`).classList.add('active');
  window.scrollTo(0, 0);
  $('burger-menu').classList.remove('open');
}

function navigateTo(id, slug) {
  window.location.hash = slug || id;
}

// --- РОБОТА З ДАНИМИ ---
async function loadPosts() {
  if (allPosts.length > 0) return renderPostsList();
  try {
    const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${POSTS_FOLDER}`);
    const files = await res.json();
    const mdFiles = files.filter(f => f.name.endsWith('.md')).reverse();

    const results = await Promise.all(mdFiles.map(async f => {
      const r = await fetch(f.download_url);
      return { slug: f.name.replace('.md', ''), text: await r.text() };
    }));

    const tags = new Set();
    allPosts = results.map(item => {
      postsCache[item.slug] = item.text;
      const t = item.text;
      const tag = parseMeta(t, 'tag') || 'Допис';
      tags.add(tag);
      const d = new Date(parseMeta(t, 'date'));
      return {
        slug: item.slug,
        title: parseMeta(t, 'title') || 'Без назви',
        excerpt: parseMeta(t, 'excerpt') || '',
        tag: tag,
        date: parseMeta(t, 'date'),
        displayDate: `<span>${d.getDate()}</span> ${MONTHS[d.getMonth()]}`
      };
    });

    renderFilters(Array.from(tags));
    renderPostsList();
  } catch(e) { console.error(e); }
}

async function openPostBySlug(slug) {
  showPage('post');
  els.postContent.innerHTML = 'Завантаження...';
  
  if (!postsCache[slug]) {
    const r = await fetch(`https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${POSTS_FOLDER}/${slug}.md`);
    postsCache[slug] = await r.text();
  }

  const text = postsCache[slug];
  const cleanMd = text.replace(/^---[\s\S]*?---/, '').trim();
  
  els.postTitle.textContent = parseMeta(text, 'title');
  const d = new Date(parseMeta(text, 'date'));
  els.postDate.textContent = `${d.getDate()} ${MONTHS_UA[d.getMonth()]} ${d.getFullYear()}`;
  els.postTag.textContent = parseMeta(text, 'tag');
  
  els.postContent.innerHTML = DOMPurify.sanitize(marked.parse(cleanMd));
  processMediaLinks();
}

function processMediaLinks() {
  const links = els.postContent.querySelectorAll('a');
  links.forEach(link => {
    const href = link.getAttribute('href');
    if (!href) return;

    // YouTube
    const yt = href.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
    if (yt) {
      const wrap = document.createElement('div');
      wrap.className = 'youtube-wrap';
      wrap.innerHTML = `<iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen loading="lazy"></iframe>`;
      link.parentNode.replaceChild(wrap, link);
      return;
    }

    // Spotify
    const sp = href.match(/open\.spotify\.com\/(track|episode|playlist)\/([a-zA-Z0-9]+)/);
    if (sp) {
      const frame = document.createElement('div');
      frame.style.margin = '1.2rem 0';
      frame.innerHTML = `<iframe style="border-radius:12px" src="https://open.spotify.com/embed/${sp[1]}/${sp[2]}" width="100%" height="152" frameBorder="0" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`;
      link.parentNode.replaceChild(frame, link);
      return;
    }

    // Cloudinary
    if (href.includes('res.cloudinary.com')) {
      const m = href.match(/res\.cloudinary\.com\/([^/]+)\/(?:video|image|raw)\/upload\/(?:v\d+\/)?(.+?)(\.[^.]+)?$/);
      if (m) {
        const cn = m[1], pi = m[2];
        const isVid = href.includes('/video/') || /^VID_/i.test(pi.split('/').pop());
        const wrap = document.createElement('div');
        if (isVid) {
          wrap.className = 'youtube-wrap';
          wrap.innerHTML = `<iframe src="https://player.cloudinary.com/embed/?cloud_name=${cn}&public_id=${encodeURIComponent(pi)}&fluid=true&controls=true" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;" allowfullscreen loading="lazy"></iframe>`;
        } else {
          wrap.style.margin = '1.2rem 0';
          wrap.innerHTML = `<iframe src="https://player.cloudinary.com/embed/?cloud_name=${cn}&public_id=${encodeURIComponent(pi)}&fluid=true&controls=true" width="100%" height="90" style="border:none;border-radius:4px;" loading="lazy"></iframe>`;
        }
        link.parentNode.replaceChild(wrap, link);
      }
    }
  });
}

// --- УТИЛІТИ ---
function parseMeta(text, key) {
  const m = text.match(new RegExp(`${key}:\\s*"?([^"\\n]+)"?`));
  return m ? m[1].trim() : '';
}

function renderFilters(tags) {
  els.tagFilters.innerHTML = tags.map(t => `<button class="tag-filter" onclick="filterByTag('${t}')">${t}</button>`).join('');
}

window.filterByTag = (tag) => {
  activeTag = (activeTag === tag) ? null : tag;
  document.querySelectorAll('.tag-filter').forEach(btn => btn.classList.toggle('active', btn.textContent === activeTag));
  renderPostsList();
};

function renderPostsList() {
  let filtered = allPosts;
  if (activeTag) filtered = filtered.filter(p => p.tag === activeTag);
  if (searchQuery) filtered = filtered.filter(p => p.title.toLowerCase().includes(searchQuery) || p.excerpt.toLowerCase().includes(searchQuery));

  els.postsContainer.innerHTML = filtered.map(p => `
    <div class="post-item" onclick="navigateTo('post', '${p.slug}')">
      <div class="post-date">${p.displayDate}</div>
      <div>
        <div class="post-title">${p.title}</div>
        <div class="post-excerpt">${p.excerpt}</div>
        <div class="post-tag">${p.tag}</div>
      </div>
    </div>
  `).join('');
}

initApp();
</script>
</body>
</html>
