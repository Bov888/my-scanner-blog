<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Як стати успішним сканером</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg: #fafaf8; --surface: #f4f3ef; --text: #1a1917; --muted: #6b6963;
            --accent: #2d5a27; --accent-light: #e8f0e6; --border: #e2e1db; --max: 720px;
        }
        [data-theme="dark"] {
            --bg: #111110; --surface: #1a1a18; --text: #e8e6e0; --muted: #8a8880;
            --accent: #6ab05f; --accent-light: #1e2e1c; --border: #2e2d2a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Literata', serif; line-height: 1.75; transition: background 0.3s; }

        /* --- НОВА ШАПКА: ДВОПОВЕРХОВА ЛОГІКА --- */
        header { 
            border-bottom: 1px solid var(--border); 
            background: var(--bg); 
            position: sticky; 
            top: 0; 
            z-index: 100;
            /* Прибираємо фіксовану висоту, щоб вона підлаштовувалася під вміст */
        }
        
        .header-inner { 
            max-width: var(--max); 
            margin: 0 auto; 
            padding: 1.2rem 1.5rem 0 1.5rem;
            display: flex; 
            flex-direction: column; /* Елементи один під одним */
            align-items: center; 
        }

        /* ПОВЕРХ 1: Лого та Кнопка */
        .header-top {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }

        .site-title { 
            font-weight: 500; 
            font-size: 1.15rem; 
            color: var(--text); 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            gap: 0.7rem; 
            cursor: pointer;
        }
        .site-title b { color: var(--accent); font-weight: 500; }

        .theme-toggle { 
            background: var(--accent-light); 
            border: 1px solid var(--accent); 
            color: var(--accent); 
            font-size: 0.65rem; 
            font-family: 'JetBrains Mono', monospace; 
            padding: 0.35rem 0.7rem; 
            border-radius: 4px; 
            text-transform: uppercase; 
            cursor: pointer;
        }

        /* ПОВЕРХ 2: Навігація */
        .nav-bar {
            width: 100%;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: center;
            padding: 0.8rem 0;
        }

        .nav-links { 
            display: flex; 
            gap: 2rem; 
        }
        
        .nav-links a { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.72rem; 
            color: var(--muted); 
            text-decoration: none; 
            text-transform: uppercase; 
            letter-spacing: 0.08em; 
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }

        /* --- ОСНОВНИЙ КОНТЕНТ --- */
        main { max-width: var(--max); margin: 0 auto; padding: 3rem 1.5rem 6rem; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .post-item { padding: 2.5rem 0; border-bottom: 1px solid var(--border); cursor: pointer; }
        .post-title { font-size: 1.5rem; font-weight: 400; margin-bottom: 0.6rem; transition: color 0.2s; }
        .post-item:hover .post-title { color: var(--accent); }
        .post-excerpt { color: var(--muted); font-size: 0.95rem; }

        .error-msg { 
            padding: 2rem; 
            background: var(--surface); 
            border: 1px dashed var(--accent); 
            border-radius: 8px; 
            text-align: center; 
            font-family: 'JetBrains Mono'; 
            font-size: 0.8rem; 
        }

        footer { 
            border-top: 1px solid var(--border); 
            padding: 4rem 0; 
            text-align: center; 
            color: var(--muted); 
            font-family: 'JetBrains Mono'; 
            font-size: 0.65rem; 
            text-transform: uppercase; 
        }

        @media (max-width: 600px) {
            .nav-links { gap: 1.2rem; }
            .site-title { font-size: 1rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="header-top">
            <a class="site-title" onclick="navigateTo('home')">
                <svg width="24" height="24" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="var(--accent-light)"/><circle cx="16" cy="15" r="4" fill="var(--accent)"/></svg>
                <span>Як стати <b>успішним сканером</b></span>
            </a>
            <button class="theme-toggle" onclick="toggleTheme()" id="theme-toggle">☾ ТЕМА</button>
        </div>
        <div class="nav-bar">
            <nav class="nav-links" id="nav-links">
                <a onclick="navigateTo('home')" data-page="home">Дописи</a>
                <a onclick="navigateTo('about')" data-page="about">Про мене</a>
                <a onclick="alert('Зв’язок незабаром')">Зв'язок</a>
            </nav>
        </div>
    </div>
</header>

<main>
    <div id="page-home" class="page active">
        <div id="posts-container">
            <p style="font-family:'JetBrains Mono'; font-size:0.8rem; color:var(--muted);">Завантаження постів...</p>
        </div>
    </div>

    <div id="page-about" class="page">
        <h1>Про мене</h1>
        <p style="margin-top:2rem;">Я — 42-річний професіонал і "сканер". Цей блог є частиною моєї системи керування знаннями (PKM).</p>
    </div>

    <div id="page-post" class="page">
        <button onclick="navigateTo('home')" style="border:none; background:none; cursor:pointer; color:var(--muted); font-family:'JetBrains Mono'; font-size:0.7rem; margin-bottom:2.5rem; letter-spacing:0.1em;">← ПОВЕРНУТИСЯ ДО СПИСКУ</button>
        <h1 id="post-title-display"></h1>
        <article id="post-content-display" style="margin-top:2.5rem;"></article>
    </div>
</main>

<footer>
    © 2026 Успішний сканер · uspishnyskaner.pp.ua
</footer>

<script>
    const GITHUB_USER = 'Bov888';
    const GITHUB_REPO = 'my-scanner-blog';
    const POSTS_FOLDER = 'posts';

    // Парсинг метаданих (Title, Excerpt) з Markdown файлу
    function parseMeta(text, key) {
        const regex = new RegExp(`${key}:\\s*(.*)`, 'i');
        const match = text.match(regex);
        return match ? match[1].trim().replace(/^["']|["']$/g, '') : null;
    }

    // Перемикач теми
    function toggleTheme() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const newTheme = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        document.getElementById('theme-toggle').textContent = isDark ? '☾ ТЕМА' : '☀ ТЕМА';
        localStorage.setItem('theme', newTheme);
    }

    // Навігація через Hash
    function navigateTo(page, slug = '') {
        window.location.hash = slug || page;
    }

    // Обробка маршрутів
    async function handleRoute() {
        const hash = window.location.hash.replace('#', '');
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        
        // Підсвічування активного посилання
        document.querySelectorAll('#nav-links a').forEach(a => {
            const isHome = (!hash || hash === 'home') && a.getAttribute('data-page') === 'home';
            const isActive = a.getAttribute('data-page') === hash;
            a.classList.toggle('active', isHome || isActive);
        });

        if (!hash || hash === 'home') {
            document.getElementById('page-home').classList.add('active');
            loadPosts();
        } else if (hash === 'about') {
            document.getElementById('page-about').classList.add('active');
        } else {
            document.getElementById('page-post').classList.add('active');
            openPostBySlug(hash);
        }
        window.scrollTo(0, 0);
    }

    // Завантаження списку постів
    async function loadPosts() {
        const container = document.getElementById('posts-container');
        try {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${POSTS_FOLDER}`);
            
            if (res.status === 403) {
                container.innerHTML = `<div class="error-msg">GitHub API Rate Limit. Спробуйте через годину або змініть IP (наприклад, через мобільний інтернет).</div>`;
                return;
            }

            const files = await res.json();
            const mdFiles = files.filter(f => f.name.endsWith('.md')).reverse();

            const results = await Promise.all(mdFiles.map(async f => {
                const r = await fetch(f.download_url);
                const text = await r.text();
                return { slug: f.name.replace('.md', ''), text };
            }));

            container.innerHTML = results.map(p => {
                const title = parseMeta(p.text, 'title') || p.slug;
                const excerpt = parseMeta(p.text, 'excerpt') || 'Натисніть, щоб прочитати цей допис повністю...';
                return `
                    <div class="post-item" onclick="navigateTo('post', '${p.slug}')">
                        <h2 class="post-title">${title}</h2>
                        <p class="post-excerpt">${excerpt}</p>
                    </div>
                `;
            }).join('');
        } catch (e) {
            container.innerHTML = `<div class="error-msg">Не вдалося завантажити дописи. Перевірте з'єднання або налаштування репозиторію.</div>`;
        }
    }

    // Відкриття конкретного посту
    async function openPostBySlug(slug) {
        const titleEl = document.getElementById('post-title-display');
        const contentEl = document.getElementById('post-content-display');
        titleEl.textContent = 'Завантаження вмісту...';
        
        try {
            const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${POSTS_FOLDER}/${slug}.md`);
            const data = await res.json();
            const text = decodeURIComponent(escape(atob(data.content)));
            
            titleEl.textContent = parseMeta(text, 'title') || slug;
            contentEl.innerHTML = marked.parse(text.replace(/---[\s\S]*?---/, ''));
        } catch (e) {
            titleEl.textContent = 'Допис не знайдено';
            contentEl.innerHTML = '';
        }
    }

    // Слухачі подій
    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('theme-toggle').textContent = '☀ ТЕМА';
        }
        handleRoute();
    });
</script>
</body>
</html>
