<script>
  let postsCache = {};

  function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + pageId).classList.add('active');
    document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
    document.getElementById('nav-' + pageId)?.classList.add('active');
    window.scrollTo(0, 0);
  }

  async function openPost(downloadUrl) {
    const container = document.getElementById('full-post-content');
    container.innerHTML = "Завантаження тексту...";
    showPage('post-view');

    if (postsCache[downloadUrl]) {
      container.innerHTML = marked.parse(postsCache[downloadUrl]);
      return;
    }

    try {
      const response = await fetch(downloadUrl);
      let text = await response.text();
      // видаляємо frontmatter
      const cleanText = text.replace(/^---[\s\S]*?---/, '');
      postsCache[downloadUrl] = cleanText;
      container.innerHTML = marked.parse(cleanText);
    } catch (e) {
      container.innerHTML = "Помилка завантаження тексту.";
    }
  }

  async function loadPosts() {
    const container = document.querySelector('#posts-container');
    try {
      const response = await fetch('https://api.github.com/repos/Bov888/my-scanner-blog/contents/posts');
      if (!response.ok) throw new Error();
      const files = await response.json();
      container.innerHTML = '';
      files.reverse();

      const monthNames = ["СІЧ","ЛЮТ","БЕР","КВІТ","ТРА","ЧЕР","ЛИП","СЕР","ВЕР","ЖОВ","ЛИС","ГРУ"];

      for (const file of files) {
        if (file.name.endsWith('.md')) {
          const contentRes = await fetch(file.download_url);
          const text = await contentRes.text();

          const title = text.match(/title:\s*"(.*)"/)?.[1] || text.match(/title:\s*(.*)/)?.[1] || "Без назви";
          const excerpt = text.match(/excerpt:\s*"(.*)"/)?.[1] || text.split('.').slice(0,2).join('.') + "...";
          const dateStr = text.match(/date:\s*(.*)/)?.[1] || "";
          const tag = text.match(/tag:\s*"(.*)"/)?.[1] || "ДОПИС";

          const date = new Date(dateStr);
          const displayDate = isNaN(date.getTime()) ? "НОВЕ" : `${monthNames[date.getMonth()]}<br>${date.getFullYear()}`;

          const postHTML = `
            <div class="post-item" onclick="openPost('${file.download_url}')">
              <div class="post-date">${displayDate}</div>
              <div>
                <div class="post-title">${title}</div>
                <div class="post-excerpt">${excerpt}</div>
                <span class="post-tag">${tag}</span>
              </div>
            </div>
          `;
          container.insertAdjacentHTML('beforeend', postHTML);
        }
      }
    } catch (e) {
      container.innerHTML = '<p>Поки що дописів немає.</p>';
    }
  }

  loadPosts();

  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
</body>
</html>
