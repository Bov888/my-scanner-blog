<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Scanner Blog</title>
    <style>
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
        }
        .video-container video,
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- Existing content remains unchanged -->

    <script>
        function embedVideos(content) {
            const videoFormats = ['mp4', 'webm', 'ogg'];
            const videoLinks = content.match(/(https?:\\/\\/)?(www\\.)?youtube\\.com\\/watch\\?v=([\w-]+)/g) || [];
            videoLinks.forEach(link => {
                const videoId = link.split('v=')[1];
                if (videoId) {
                    content = content.replace(link, `<div class='video-container'><iframe src='https://www.youtube.com/embed/${videoId}' frameborder='0' allowfullscreen></iframe></div>`);
                }
            });
            videoFormats.forEach(format => {
                const fileLinks = content.match(/([\w\-\.]+)\\.${format}/g) || [];
                fileLinks.forEach(file => {
                    content = content.replace(file, `<div class='video-container'><video controls><source src='${file}' type='video/${format}'></video></div>`);
                });
            });
            return content;
        }

        // Invoke embedVideos where appropriate in your existing functionality
        // Example: let updatedContent = embedVideos(existingContent);
    </script>
</body>
</html>
