name: Generate Posts Index

on:
  push:
    paths:
      - 'posts/**' # Запускати тільки якщо змінилися файли в папці posts

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Дозвіл на запис у репозиторій

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run index generator
        run: python generate_index.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update posts.json" && git push)
