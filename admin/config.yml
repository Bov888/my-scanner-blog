backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow


# Decap генерує ім'я файлу з поля slug у frontmatter
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

media_library:
  name: cloudinary
  config:
    cloud_name: dyvv0gduq
    api_key: "363277514958419"
    use_secure_url: true

media_folder: "images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "Дописи"
    folder: "posts"
    create: true
    slug: "{{fields.slug}}"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "slug", name: "slug", widget: "hidden", default: "" }
      - { label: "Короткий опис", name: "excerpt", widget: "string" }
      - { label: "Дата", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - label: "Теги"
        name: "tag"
        widget: "relation"
        collection: "tags"
        search_fields: ["name"]
        value_field: "name"
        display_fields: ["name"]
      - { label: "Вміст", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Сторінки"
    folder: "pages"
    create: true
    slug: "{{fields.slug}}"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "slug", name: "slug", widget: "hidden", default: "" }
      - { label: "Опис", name: "description", widget: "string", required: false }
      - { label: "Вміст", name: "body", widget: "markdown" }

  - name: "tags"
    label: "Теги"
    label_singular: "Тег"
    folder: "tags"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: "name"
    fields:
      - { label: "Назва тегу", name: "name", widget: "string" }
      - { label: "slug", name: "slug", widget: "hidden", default: "" }
