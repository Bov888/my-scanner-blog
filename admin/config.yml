collections:
  - name: "posts"
    label: "Дописи"
    folder: "posts" # Шлях згідно з image_5ead0b.png
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Короткий опис", name: "excerpt", widget: "string" }
      # ВИПРАВЛЕНО: використовуємо yyyy замість YYYY
      - { label: "Дата", name: "date", widget: "datetime", format: "yyyy-MM-dd" }
      - { label: "Тег", name: "tag", widget: "select", options: ["PKM", "ШІ та автоматизація", "Спорт та дисципліна", "Життя сканера", "Інструменти", "Нотатки"] }
      - { label: "Вміст", name: "body", widget: "markdown" }
