backend:
  name: git-gateway
  branch: main

media_library:
  name: cloudinary
  config:
    cloud_name: dyvv0gduq
    api_key: 363277514958419
    api_secret: npjLvpKRgXgmzzh82ZJsKp4jGLE
    folder: "успішний сканер"
    use_secure_url: true
    output_filename_only: false

media_folder: "images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "Дописи"
    folder: "posts" # Шлях за твоїм скріншотом
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Короткий опис", name: "excerpt", widget: "string" }
      - { label: "Дата", name: "date", widget: "datetime", date_format: "yyyy-MM-dd", time_format: false }
      - label: "Тег"
        name: "tag"
        widget: "select"
        options:
          - { label: "PKM", value: "PKM" }
          - { label: "ШІ та автоматизація", value: "ШІ та автоматизація" }
          - { label: "Спорт та дисципліна", value: "Спорт та дисципліна" }
          - { label: "Життя сканера", value: "Життя сканера" }
          - { label: "Інструменти", value: "Інструменти" }
          - { label: "Нотатки", value: "Нотатки" }
      - label: "Вміст"
        name: "body"
        widget: "markdown"
        media_library:
          config:
            multiple: true

  - name: "pages"
    label: "Сторінки"
    folder: "pages" # Шлях за твоїм скріншотом
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Опис", name: "description", widget: "string", required: false }
      - { label: "Вміст", name: "body", widget: "markdown" }
