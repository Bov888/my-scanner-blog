backend:
  name: git-gateway
  branch: main

# Конфігурація посилань (slug)
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

# Налаштування хмари Cloudinary
media_library:
  name: cloudinary
  config:
    cloud_name: dyvv0gduq
    api_key: "363277514958419"
    use_secure_url: true

# Ці папки мають бути в репозиторії для технічних потреб CMS
media_folder: "images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "Дописи"
    folder: "posts"
    create: true
    # Використовуємо значення з поля 'slug' для назви файлу
    slug: "{{slug}}" 
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Коротке посилання (URL латиницею)", name: "slug", widget: "string", hint: "Можна залишити порожнім — тоді згенерується автоматично латиницею.", required: false }
      - { label: "Короткий опис", name: "excerpt", widget: "string" }
      - { label: "Дата", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - label: "Тег"
        name: "tag"
        widget: "select"
        options:
          - { label: "PKM", value: "PKM" }
          - { label: "ШІ та автоматизація", value: "ШІ та автоматизація" }
          - { label: "Спорт та дисципліна", value: "Спорт та дисципліна" }
          - { label: "Життя сканера", value: "Життя сканера" }
          - { label: "Інструменти", value: "Інструменти" }
          - { label: "Нотатки", value: "Нотатки" }
      - { label: "Вміст", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Сторінки"
    folder: "pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Опис", name: "description", widget: "string", required: false }
      - { label: "Вміст", name: "body", widget: "markdown" }
