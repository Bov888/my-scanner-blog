backend:
  name: git-gateway
  branch: main

# Налаштування автоматичної транслітерації
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

media_library:
  name: cloudinary
  config:
    cloud_name: dyvv0gduq
    api_key: "363277514958419"
    use_secure_url: true

media_folder: "images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "Дописи"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "URL (латиницею)", name: "slug", widget: "string", required: false, hint: "Генерується автоматично латиницею" }
      - { label: "Короткий опис", name: "excerpt", widget: "string" }
      - { label: "Дата", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Тег", name: "tag", widget: "select", options: ["PKM", "ШІ та автоматизація", "Спорт та дисципліна", "Життя сканера", "Інструменти", "Нотатки"] }
      - { label: "Вміст", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Сторінки"
    folder: "pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Опис", name: "description", widget: "string", required: false }
      - { label: "Вміст", name: "body", widget: "markdown" }
