backend:
  name: git-gateway
  branch: main

# Стандартне налаштування для автоматичної транслітерації
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

media_library:
  name: cloudinary
  config:
    cloud_name: dyvv0gduq
    api_key: "363277514958419"
    use_secure_url: true

media_folder: "images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "Дописи"
    folder: "posts"
    create: true
    slug: "{{fields.slug}}"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - label: "Slug (адреса посту латиницею)"
        name: "slug"
        widget: "string"
        hint: "Тільки латинські літери, цифри та дефіси. Наприклад: miy-pershyi-post"
        pattern:
          - "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          - "Лише малі латинські літери, цифри та дефіси (-)"
      - { label: "Короткий опис", name: "excerpt", widget: "string" }
      - { label: "Дата", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - label: "Теги"
        name: "tag"
        widget: "relation"
        collection: "tags"
        search_fields: ["name"]
        value_field: "name"
        display_fields: ["name"]
      - { label: "Вміст", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Сторінки"
    folder: "pages"
    create: true
    slug: "{{fields.slug}}"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - label: "Slug (адреса сторінки латиницею)"
        name: "slug"
        widget: "string"
        hint: "Тільки латинські літери, цифри та дефіси"
        pattern:
          - "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          - "Лише малі латинські літери, цифри та дефіси (-)"
      - { label: "Опис", name: "description", widget: "string", required: false }
      - { label: "Вміст", name: "body", widget: "markdown" }

  - name: "tags"
    label: "Теги"
    label_singular: "Тег"
    folder: "tags"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: "name"
    fields:
      - { label: "Назва тегу", name: "name", widget: "string" }
      - label: "Slug тегу (латиницею)"
        name: "slug"
        widget: "string"
        hint: "Наприклад: pkm, zhyttia-skanera, sport"
        pattern:
          - "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          - "Лише малі латинські літери, цифри та дефіси (-)"
