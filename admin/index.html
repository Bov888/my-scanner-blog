<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Адмін-панель | Успішний Сканер</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.11.0/dist/decap-cms.js"></script>
  <script src="https://unpkg.com/netlify-cms-media-library-cloudinary@1.0.3/dist/netlify-cms-media-library-cloudinary.js"></script>

  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }

    // ── Таблиця транслітерації (українська → латиниця) ───────────────────────
    const TRANSLIT_MAP = {
      'а':'a',  'б':'b',  'в':'v',  'г':'h',  'ґ':'g',
      'д':'d',  'е':'e',  'є':'ie', 'ж':'zh', 'з':'z',
      'и':'y',  'і':'i',  'ї':'yi', 'й':'i',  'к':'k',
      'л':'l',  'м':'m',  'н':'n',  'о':'o',  'п':'p',
      'р':'r',  'с':'s',  'т':'t',  'у':'u',  'ф':'f',
      'х':'kh', 'ц':'ts', 'ч':'ch', 'ш':'sh', 'щ':'shch',
      'ь':'',   'ю':'iu', 'я':'ia',
      'А':'a',  'Б':'b',  'В':'v',  'Г':'h',  'Ґ':'g',
      'Д':'d',  'Е':'e',  'Є':'ie', 'Ж':'zh', 'З':'z',
      'И':'y',  'І':'i',  'Ї':'yi', 'Й':'i',  'К':'k',
      'Л':'l',  'М':'m',  'Н':'n',  'О':'o',  'П':'p',
      'Р':'r',  'С':'s',  'Т':'t',  'У':'u',  'Ф':'f',
      'Х':'kh', 'Ц':'ts', 'Ч':'ch', 'Ш':'sh', 'Щ':'shch',
      'Ь':'',   'Ю':'iu', 'Я':'ia',
    };

    function toSlug(str) {
      return str
        .split('')
        .map(ch => {
          if (TRANSLIT_MAP[ch] !== undefined) return TRANSLIT_MAP[ch];
          if (/[a-zA-Z0-9]/.test(ch)) return ch.toLowerCase();
          if (/[\s\-_/\\]/.test(ch)) return '-';
          return '';
        })
        .join('')
        .replace(/-{2,}/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    // ── Форсуємо значення в React-контрольований інпут ──────────────────────
    function forceValue(input, value) {
      const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;
      setter.call(input, value);
      input.dispatchEvent(new Event('input',  { bubbles: true }));
      input.dispatchEvent(new Event('change', { bubbles: true }));
    }

    // ── Знаходимо пару (titleInput, slugInput) у формі ──────────────────────
    // Decap 3.x рендерить форму як набір <div> з <label> і <input>.
    // Шукаємо label з текстом "ЗАГОЛОВОК" і "SLUG" — вони є в DOM після монтування.
    function findInputs() {
      const labels = [...document.querySelectorAll('label')];

      const titleLabel = labels.find(l => /^заголовок/i.test(l.textContent.trim()));
      const slugLabel  = labels.find(l => /^slug/i.test(l.textContent.trim()));

      if (!titleLabel || !slugLabel) return null;

      // Шукаємо input в батьківському блоці кожного label
      const titleInput = titleLabel.closest('[class]')?.querySelector('input') ||
                         titleLabel.parentElement?.querySelector('input');
      const slugInput  = slugLabel.closest('[class]')?.querySelector('input') ||
                         slugLabel.parentElement?.querySelector('input');

      if (!titleInput || !slugInput) return null;
      return { titleInput, slugInput };
    }

    // ── Прикріплюємо слухачі до знайденої пари інпутів ──────────────────────
    let _attached = false;    // чи вже прикріплені слухачі до поточної форми
    let _userEdited = false;  // чи редагував користувач slug вручну

    function attach(titleInput, slugInput) {
      _attached = true;
      _userEdited = false;

      // Якщо при першому знаходженні title вже заповнений — одразу генеруємо slug
      if (titleInput.value && !slugInput.value) {
        forceValue(slugInput, toSlug(titleInput.value));
      }

      // Слухаємо зміни title → оновлюємо slug
      titleInput.addEventListener('input', () => {
        if (_userEdited) return;
        forceValue(slugInput, toSlug(titleInput.value));
      });

      // Якщо користувач сам торкнувся slug — більше не перезаписуємо
      slugInput.addEventListener('input', () => {
        // Вважаємо "ручне редагування" тільки якщо значення відрізняється від
        // того, що ми б згенерували — це відсіює наші власні forceValue-дзвінки
        const expected = toSlug(titleInput.value);
        if (slugInput.value !== expected) {
          _userEdited = true;
        }
      });

      // Слідкуємо: якщо інпути зникли з DOM (перехід на інший запис) —
      // скидаємо прапор і починаємо пошук знову
      const guard = new MutationObserver(() => {
        if (!document.body.contains(titleInput)) {
          _attached = false;
          _userEdited = false;
          guard.disconnect();
          poll();
        }
      });
      guard.observe(document.body, { childList: true, subtree: true });
    }

    // ── Поллінг: чекаємо появи форми і прикріплюємо слухачі ─────────────────
    // Запускається при завантаженні і після кожного переходу між записами.
    function poll() {
      const timer = setInterval(() => {
        if (_attached) { clearInterval(timer); return; }
        const found = findInputs();
        if (found) {
          clearInterval(timer);
          attach(found.titleInput, found.slugInput);
        }
      }, 300);

      // Страховка: якщо за 30 секунд форма не з'явилась — зупиняємось
      setTimeout(() => clearInterval(timer), 30000);
    }

    // Запускаємо після завантаження сторінки
    window.addEventListener('load', () => setTimeout(poll, 500));

    // ── Кастомний EditorComponent для вставки медіа ──────────────────────────
    CMS.registerEditorComponent({
      id: "cloudinary-media",
      label: "Відео / Аудіо",
      icon: "film",
      fields: [
        { name: "url", label: "Файл з хмари", widget: "file" },
        { name: "label", label: "Підпис", widget: "string", required: false }
      ],
      toBlock: ({ url, label }) => `[${label || 'Медіа'}](${url})`,
      toPreview: ({ url, label }) => `<div style="padding:10px;border:1px solid #ccc;">${label || 'Медіа'}</div>`,
      pattern: /^\[([^\]]*)\]\((https?:\/\/[^)]*)\)$/,
      fromBlock: match => ({ label: match[1], url: match[2] })
    });
  </script>
</body>
</html>
