<script>
  // 1. АВТОРИЗАЦІЯ (залишаємо як було)
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }

  // 2. ОНОВЛЕНА РЕЄСТРАЦІЯ 🎬
  CMS.registerEditorComponent({
    id: "cloudinary_media",
    label: "Cloudinary Video",
    icon: 'media',
    // Ми залишаємо порожній масив полів, щоб CMS не малювала інпути
    fields: [],
    
    // Викликаємо хмару відразу
    onAdd: function() {
      return new Promise((resolve) => {
        if (!window.cloudinary) {
          alert("Бібліотека Cloudinary ще завантажується...");
          return;
        }

        window.cloudinary.openMediaLibrary(
          {
            cloud_name: "dyvv0gduq",
            api_key: "363277514958419",
            multiple: false,
            // Додаємо цей параметр для примусового відкриття поверх всього
            z_index: 99999 
          },
          {
            insertHandler: function(data) {
              const url = data.assets[0].secure_url;
              resolve({ url: url });
            }
          }
        );
      });
    },
    
    // Обробка результату
    toBlock: function(obj) {
      return `[${obj.url}](${obj.url})`;
    },
    pattern: /^\[(.+?)\]\((.+?)\)$/,
    fromBlock: function(match) {
      return { url: match[2] };
    },
    toPreview: function(obj) {
      return `<div style="padding:8px; background:#f0f7ff; border:1px solid #0075ff; border-radius:4px;">🎬 <b>Відео додано</b></div>`;
    }
  });
</script>
