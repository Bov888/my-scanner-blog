<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Адмін-панель | Успішний Сканер</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.11.0/dist/decap-cms.js"></script>
  <script src="https://unpkg.com/netlify-cms-media-library-cloudinary@1.0.3/dist/netlify-cms-media-library-cloudinary.js"></script>

  <script>
    // Netlify Identity — редирект після логіну
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }

    // Кастомний EditorComponent для вставки медіа з Cloudinary
    CMS.registerEditorComponent({
      id: "cloudinary-media",
      label: "Відео / Аудіо",
      icon: "film",

      fields: [
        {
          name: "url",
          label: "Файл з хмари",
          widget: "file",
          media_library: {
            config: { multiple: false }
          }
        },
        {
          name: "label",
          label: "Підпис",
          widget: "string",
          required: false,
          default: "Медіа"
        }
      ],

      toBlock: ({ url, label }) => {
        if (!url) return '';
        return `[${label || 'Медіа'}](${url})`;
      },

      toPreview: ({ url, label }) => {
        if (!url) return '';
        const name = label || url.split('/').pop();
        const isVideo = /\.(mp4|mov|webm|avi|mkv)/i.test(url) || /VID_|vid_/i.test(url);
        const icon = isVideo ? '🎬' : '🎵';
        const type = isVideo ? 'Відео' : 'Аудіо';
        return `<div style="background:#1e1d1b;padding:0.8rem 1rem;border-radius:4px;border:1px solid #2e2d2a;color:#6ab05f;font-family:monospace;font-size:0.75rem;">
          ${icon} ${type}: <strong>${name}</strong>
        </div>`;
      },

      pattern: /^\[([^\]]*)\]\((https?:\/\/[^)]*(?:cloudinary\.com|\.mp3|\.mp4|\.mov|\.webm)[^)]*)\)$/,
      fromBlock: match => ({
        label: match[1],
        url: match[2]
      })
    });

    // Попередній перегляд дописів
    CMS.registerPreviewTemplate("posts", createClass({
      render: function() {
        const entry = this.props.entry;
        const title = entry.getIn(["data", "title"]);
        const date = entry.getIn(["data", "date"]);
        const body = this.props.widgetFor("body");
        
        return h('div', { style: { 
          padding: '2rem', 
          maxWidth: '680px', 
          margin: '0 auto', 
          fontFamily: 'Literata, serif', 
          lineHeight: '1.75', 
          background: '#fafaf8', 
          color: '#1a1917' 
        }},
          h('h1', { style: { 
            fontSize: '1.8rem', 
            fontWeight: '300', 
            marginBottom: '1rem', 
            borderBottom: '1px solid #e2e1db', 
            paddingBottom: '1rem' 
          }}, title),
          h('div', { style: { 
            fontSize: '0.8rem', 
            color: '#6b6963', 
            marginBottom: '2rem', 
            fontFamily: 'JetBrains Mono, monospace' 
          }}, date ? new Date(date).toLocaleDateString('uk-UA') : ''),
          h('div', { className: 'post-content' }, body)
        );
      }
    }));
  </script>
</body>
</html>
