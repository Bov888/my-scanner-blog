<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Адмін-панель | Успішний Сканер</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.11.0/dist/decap-cms.js"></script>
  <script src="https://unpkg.com/netlify-cms-media-library-cloudinary@1.0.3/dist/netlify-cms-media-library-cloudinary.js"></script>

  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }

    // ── Таблиця транслітерації (українська → латиниця) ──────────────────────
    const TRANSLIT_MAP = {
      'а':'a',  'б':'b',  'в':'v',  'г':'h',  'ґ':'g',
      'д':'d',  'е':'e',  'є':'ie', 'ж':'zh', 'з':'z',
      'и':'y',  'і':'i',  'ї':'yi', 'й':'i',  'к':'k',
      'л':'l',  'м':'m',  'н':'n',  'о':'o',  'п':'p',
      'р':'r',  'с':'s',  'т':'t',  'у':'u',  'ф':'f',
      'х':'kh', 'ц':'ts', 'ч':'ch', 'ш':'sh', 'щ':'shch',
      'ь':'',   'ю':'iu', 'я':'ia',
      // Великі — транслітеруються так само
      'А':'a',  'Б':'b',  'В':'v',  'Г':'h',  'Ґ':'g',
      'Д':'d',  'Е':'e',  'Є':'ie', 'Ж':'zh', 'З':'z',
      'И':'y',  'І':'i',  'Ї':'yi', 'Й':'i',  'К':'k',
      'Л':'l',  'М':'m',  'Н':'n',  'О':'o',  'П':'p',
      'Р':'r',  'С':'s',  'Т':'t',  'У':'u',  'Ф':'f',
      'Х':'kh', 'Ц':'ts', 'Ч':'ch', 'Ш':'sh', 'Щ':'shch',
      'Ь':'',   'Ю':'iu', 'Я':'ia',
    };

    function toSlug(str) {
      return str
        .split('')
        .map(ch => {
          if (TRANSLIT_MAP[ch] !== undefined) return TRANSLIT_MAP[ch];
          // латиниця, цифри — залишаємо
          if (/[a-zA-Z0-9]/.test(ch)) return ch.toLowerCase();
          // пробіли та розділові — в дефіс
          if (/[\s\-_/\\]/.test(ch)) return '-';
          // решту (символи, емодзі тощо) — прибираємо
          return '';
        })
        .join('')
        // прибираємо дефіси на початку/кінці та подвійні дефіси
        .replace(/-{2,}/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    // ── Авто-заповнення slug при зміні title ────────────────────────────────
    // Decap CMS рендерить форму в Shadow DOM або у звичайний DOM залежно від версії.
    // Використовуємо MutationObserver, щоб зачепитися після того, як форма з'явиться.
    function attachSlugAutofill() {
      // Шукаємо інпут заголовка та slug за їх id-атрибутами (Decap генерує id="title" і id="slug")
      const titleInput = document.querySelector('[id$="-title"]') ||
                         document.querySelector('input[name="title"]') ||
                         document.querySelector('[data-testid="title-field"] input') ||
                         [...document.querySelectorAll('label')].find(l => /заголовок/i.test(l.textContent))?.nextElementSibling?.querySelector('input');

      const slugInput  = document.querySelector('[id$="-slug"]') ||
                         document.querySelector('input[name="slug"]') ||
                         document.querySelector('[data-testid="slug-field"] input') ||
                         [...document.querySelectorAll('label')].find(l => /^slug/i.test(l.textContent))?.nextElementSibling?.querySelector('input');

      if (!titleInput || !slugInput) return false; // ще не змонтовано

      // Прапор: якщо користувач сам редагував slug — не перезаписуємо
      let userEditedSlug = false;

      slugInput.addEventListener('input', () => { userEditedSlug = true; });

      titleInput.addEventListener('input', () => {
        if (userEditedSlug) return;
        const generated = toSlug(titleInput.value);
        // Оновлюємо значення через нативний setter (React/Preact контролює значення)
        const nativeSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
        nativeSetter.call(slugInput, generated);
        slugInput.dispatchEvent(new Event('input', { bubbles: true }));
      });

      // Скидаємо прапор при відкритті нового допису (кнопка "Новий")
      const observer = new MutationObserver(() => {
        if (!document.contains(slugInput)) {
          userEditedSlug = false;
          observer.disconnect();
          // Пробуємо перепідключитися після наступного рендеру
          setTimeout(() => tryAttach(), 800);
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      return true;
    }

    function tryAttach(attempts) {
      attempts = attempts || 0;
      if (attachSlugAutofill()) return;
      if (attempts < 30) setTimeout(() => tryAttach(attempts + 1), 400);
    }

    // Запускаємо після того, як CMS ініціалізується
    CMS.registerEventListener({
      name: 'preSave',
      handler: () => {} // порожній — потрібен лише щоб переконатись, що CMS API підхоплено
    });

    window.addEventListener('load', () => setTimeout(tryAttach, 600));

    // Ловимо кліки по навігації CMS (перехід до нового поста) і перепідключаємося
    document.addEventListener('click', (e) => {
      if (e.target && e.target.closest && e.target.closest('[data-testid="new-entry-button"], a[href*="/new"], button')) {
        userEditedSlug = false;
        setTimeout(tryAttach, 800);
      }
    }, true);

    // ── Кастомний EditorComponent для вставки медіа ──────────────────────────
    CMS.registerEditorComponent({
      id: "cloudinary-media",
      label: "Відео / Аудіо",
      icon: "film",
      fields: [
        { name: "url", label: "Файл з хмари", widget: "file" },
        { name: "label", label: "Підпис", widget: "string", required: false }
      ],
      toBlock: ({ url, label }) => `[${label || 'Медіа'}](${url})`,
      toPreview: ({ url, label }) => `<div style="padding:10px;border:1px solid #ccc;">${label || 'Медіа'}</div>`,
      pattern: /^\[([^\]]*)\]\((https?:\/\/[^)]*)\)$/,
      fromBlock: match => ({ label: match[1], url: match[2] })
    });
  </script>
</body>
</html>
