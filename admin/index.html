<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Адмін-панель | Успішний Сканер</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://media-library.cloudinary.com/global/all.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="https://unpkg.com/netlify-cms-media-library-cloudinary@^1.0.0/dist/netlify-cms-media-library-cloudinary.js"></script>
  
  <script>
    // 1. АВТОРИЗАЦІЯ
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }

    // 2. РЕЄСТРАЦІЯ КОМПОНЕНТА З КНОПКОЮ
    CMS.registerEditorComponent({
      id: "cloudinary_media",
      label: "Cloudinary Video",
      icon: 'media',
      fields: [{ 
        name: 'url', 
        label: 'Натисніть кнопку вище для вибору', 
        widget: 'string' 
      }],
      
      // Логіка відкриття
      onAdd: function() {
        // Ми не повертаємо Promise відразу, щоб дати користувачу натиснути кнопку у вікні
        return { url: "" };
      },

      toBlock: function(obj) {
        return `[${obj.url}](${obj.url})`;
      },
      pattern: /^\[(.+?)\]\((.+?)\)$/,
      fromBlock: function(match) {
        return { url: match[2] };
      },
      // Додаємо кнопку прямо в інтерфейс адмінки
      toPreview: function(obj) {
        return `
          <div style="padding:15px; border:2px dashed #0075ff; text-align:center; background:#f0f7ff; border-radius:8px;">
            <button type="button" id="btn-cloud" style="background:#0075ff; color:#fff; border:none; padding:10px 20px; border-radius:5px; cursor:pointer; font-weight:bold;">
              🎬 ВІДКРИТИ CLOUDINARY
            </button>
            <p style="font-size:12px; margin-top:10px; color:#666;">${obj.url || 'Файл не вибрано'}</p>
          </div>
          <script>
            document.getElementById('btn-cloud')?.addEventListener('click', function() {
              window.cloudinary.openMediaLibrary({
                cloud_name: "dyvv0gduq",
                api_key: "363277514958419",
                multiple: false
              }, {
                insertHandler: function(data) {
                  const url = data.assets[0].secure_url;
                  // Знаходимо інпут і вставляємо туди посилання
                  const input = document.querySelector('input[id^="url-"]');
                  if (input) {
                    input.value = url;
                    // Провокуємо подію зміни, щоб CMS зберегла дані
                    input.dispatchEvent(new Event('input', { bubbles: true }));
                  }
                  alert('Відео вибрано! Тепер натисніть "Save" у вікні блоку.');
                }
              });
            });
          <\/script>
        `;
      }
    });
  </script>
</body>
</html>
