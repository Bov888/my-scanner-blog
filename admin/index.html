<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Адмін-панель | Успішний Сканер</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://media-library.cloudinary.com/global/all.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="https://unpkg.com/netlify-cms-media-library-cloudinary@^1.0.0/dist/netlify-cms-media-library-cloudinary.js"></script>
  
  <script>
    // 1. АВТОРИЗАЦІЯ
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }

    // 2. КНОПКА ШВИДКОЇ ВСТАВКИ 🎬
    CMS.registerEditorComponent({
      id: "cloudinary_media",
      label: "Cloudinary Video/Audio",
      icon: 'media',
      // Поля залишаємо для технічної валідації, але ми їх "проскочимо"
      fields: [{ name: 'url', widget: 'hidden' }],
      
      // Головна зміна тут: ми викликаємо Cloudinary відразу
      onAdd: function() {
        return new Promise((resolve) => {
          window.cloudinary.openMediaLibrary(
            {
              cloud_name: "dyvv0gduq",
              api_key: "363277514958419",
              multiple: false
            },
            {
              insertHandler: function(data) {
                const asset = data.assets[0];
                // Повертаємо посилання прямо в Markdown форматі
                resolve({ url: asset.secure_url });
              }
            }
          );
        });
      },
      // Формат, який вставиться в текст
      toBlock: function(obj) {
        return `[${obj.url}](${obj.url})`;
      },
      pattern: /^\[(.+?)\]\((.+?)\)$/,
      fromBlock: function(match) {
        return { url: match[2] };
      },
      toPreview: function(obj) {
        return `<div style="color: #2d5a27; font-size: 0.8rem; border: 1px solid #e2e1db; padding: 5px; border-radius: 4px;">🎬 Media: ${obj.url}</div>`;
      }
    });
  </script>
</body>
</html>
