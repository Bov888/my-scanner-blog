<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Адмін-панель | Успішний Сканер</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.11.0/dist/decap-cms.js"></script>
  <script src="https://unpkg.com/netlify-cms-media-library-cloudinary@1.0.3/dist/netlify-cms-media-library-cloudinary.js"></script>

  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }

    // ── Таблиця транслітерації (українська → латиниця) ───────────────────────
    const TRANSLIT_MAP = {
      'а':'a',  'б':'b',  'в':'v',  'г':'h',  'ґ':'g',
      'д':'d',  'е':'e',  'є':'ie', 'ж':'zh', 'з':'z',
      'и':'y',  'і':'i',  'ї':'yi', 'й':'i',  'к':'k',
      'л':'l',  'м':'m',  'н':'n',  'о':'o',  'п':'p',
      'р':'r',  'с':'s',  'т':'t',  'у':'u',  'ф':'f',
      'х':'kh', 'ц':'ts', 'ч':'ch', 'ш':'sh', 'щ':'shch',
      'ь':'',   'ю':'iu', 'я':'ia',
      'А':'a',  'Б':'b',  'В':'v',  'Г':'h',  'Ґ':'g',
      'Д':'d',  'Е':'e',  'Є':'ie', 'Ж':'zh', 'З':'z',
      'И':'y',  'І':'i',  'Ї':'yi', 'Й':'i',  'К':'k',
      'Л':'l',  'М':'m',  'Н':'n',  'О':'o',  'П':'p',
      'Р':'r',  'С':'s',  'Т':'t',  'У':'u',  'Ф':'f',
      'Х':'kh', 'Ц':'ts', 'Ч':'ch', 'Ш':'sh', 'Щ':'shch',
      'Ь':'',   'Ю':'iu', 'Я':'ia',
    };

    function toSlug(str) {
      return str
        .split('')
        .map(ch => {
          if (TRANSLIT_MAP[ch] !== undefined) return TRANSLIT_MAP[ch];
          if (/[a-zA-Z0-9]/.test(ch)) return ch.toLowerCase();
          if (/[\s\-_/\\]/.test(ch)) return '-';
          return '';
        })
        .join('')
        .replace(/-{2,}/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    // ── Авто-slug через нативний API Decap CMS ───────────────────────────────
    // CMS.registerEventListener('change') спрацьовує всередині React-стану CMS,
    // тому не залежить від DOM-селекторів.
    // entry.getIn(['data','slug']) — поточне значення поля slug у стані форми.
    // Якщо воно вже не порожнє (користувач редагував вручну) — не чіпаємо.

    // Прапор: чи редагував користувач slug вручну для поточного запису
    let _userEditedSlug = false;
    let _lastEntryPath  = null;   // відстежуємо перехід до нового запису

    CMS.registerEventListener({
      name: 'change',
      handler: ({ entry }) => {
        // Якщо відкрили новий запис — скидаємо прапор
        const currentPath = entry.get('path') || entry.get('slug') || '';
        if (currentPath !== _lastEntryPath) {
          _userEditedSlug = false;
          _lastEntryPath  = currentPath;
        }

        const title   = entry.getIn(['data', 'title']) || '';
        const slugNow = entry.getIn(['data', 'slug'])  || '';

        // Якщо slug вже заповнений вручну — не перезаписуємо
        if (_userEditedSlug && slugNow !== '') return;

        // Якщо slug відрізняється від транслітерованого title — значить
        // користувач сам його змінив; фіксуємо прапор
        const generated = toSlug(title);
        if (slugNow !== '' && slugNow !== generated && slugNow !== toSlug(title)) {
          _userEditedSlug = true;
          return;
        }

        // Якщо slug порожній або збігається з попередньою генерацією — оновлюємо
        if (!_userEditedSlug) {
          // Записуємо slug назад у стан через DOM (CMS.updateEntry недоступний
          // в Decap 3.x, тому знаходимо інпут і форсуємо React-подію)
          setTimeout(() => {
            const slugInput = findSlugInput();
            if (!slugInput) return;

            const currentVal = slugInput.value;
            // Якщо поле порожнє або рівне попередньому auto-slug — перезаписуємо
            if (currentVal === '' || currentVal === generated) {
              forceInputValue(slugInput, generated);
            } else {
              // Користувач вписав щось інше — більше не чіпаємо
              _userEditedSlug = true;
            }
          }, 0);
        }
      }
    });

    function findSlugInput() {
      // Decap 3.x: поле slug рендериться як <input> всередині блоку з label "SLUG…"
      // Намагаємося знайти за кількома стратегіями — від специфічного до загального
      const byLabel = [...document.querySelectorAll('label, [class*="label"]')]
        .find(el => /^slug/i.test(el.textContent.trim()));
      if (byLabel) {
        const inp = byLabel.closest('[class*="control"], [class*="field"], div')
                           ?.querySelector('input[type="text"], input:not([type])');
        if (inp) return inp;
      }
      // Fallback: другий текстовий input у формі (перший — title)
      const allInputs = [...document.querySelectorAll(
        'input[type="text"]:not([readonly]), input:not([type]):not([readonly])'
      )];
      return allInputs[1] || null;
    }

    function forceInputValue(input, value) {
      const nativeSetter = Object.getOwnPropertyDescriptor(
        window.HTMLInputElement.prototype, 'value'
      ).set;
      nativeSetter.call(input, value);
      input.dispatchEvent(new Event('input',  { bubbles: true }));
      input.dispatchEvent(new Event('change', { bubbles: true }));
    }

    // Скидаємо прапор при кліку «Новий допис» або навігації
    document.addEventListener('click', (e) => {
      const btn = e.target && e.target.closest &&
                  e.target.closest('a[href*="/new"], [data-testid*="new"]');
      if (btn) { _userEditedSlug = false; _lastEntryPath = null; }
    }, true);

    // ── Кастомний EditorComponent для вставки медіа ──────────────────────────
    CMS.registerEditorComponent({
      id: "cloudinary-media",
      label: "Відео / Аудіо",
      icon: "film",
      fields: [
        { name: "url", label: "Файл з хмари", widget: "file" },
        { name: "label", label: "Підпис", widget: "string", required: false }
      ],
      toBlock: ({ url, label }) => `[${label || 'Медіа'}](${url})`,
      toPreview: ({ url, label }) => `<div style="padding:10px;border:1px solid #ccc;">${label || 'Медіа'}</div>`,
      pattern: /^\[([^\]]*)\]\((https?:\/\/[^)]*)\)$/,
      fromBlock: match => ({ label: match[1], url: match[2] })
    });
  </script>
</body>
</html>
