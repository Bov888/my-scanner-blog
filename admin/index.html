<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Адмін-панель | Успішний Сканер</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.11.0/dist/decap-cms.js"></script>
  <script src="https://unpkg.com/netlify-cms-media-library-cloudinary@1.0.3/dist/netlify-cms-media-library-cloudinary.js"></script>

  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }

    // Кастомний EditorComponent для вставки медіа
    CMS.registerEditorComponent({
      id: "cloudinary-media",
      label: "Відео / Аудіо",
      icon: "film",
      fields: [
        { name: "url", label: "Файл з хмари", widget: "file" },
        { name: "label", label: "Підпис", widget: "string", required: false }
      ],
      toBlock: ({ url, label }) => `[${label || 'Медіа'}](${url})`,
      toPreview: ({ url, label }) => `<div style="padding:10px;border:1px solid #ccc;">${label || 'Медіа'}</div>`,
      pattern: /^\[([^\]]*)\]\((https?:\/\/[^)]*)\)$/,
      fromBlock: match => ({ label: match[1], url: match[2] })
    });
  </script>
</body>
</html>
